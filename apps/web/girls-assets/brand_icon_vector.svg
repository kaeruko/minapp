<svg xmlns="http://www.w3.org/2000/svg" width="1248" height="1248" viewBox="0 0 1248 1248">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffdce7"/>
      <stop offset="55%" stop-color="#fbc5d4"/>
      <stop offset="100%" stop-color="#f7b7c9"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9fbd"/>
      <stop offset="100%" stop-color="#f27fa7"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4b6e6"/>
      <stop offset="100%" stop-color="#cf8ed3"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe197"/>
      <stop offset="100%" stop-color="#ffc95d"/>
    </linearGradient>

    <!-- 5-petal flower built from overlapping ellipses -->
    <g id="flower">
      <ellipse cx="0" cy="-94" rx="72" ry="105"/>
      <ellipse cx="89" cy="-27" rx="72" ry="105" transform="rotate(72 89 -27)"/>
      <ellipse cx="55" cy="76" rx="72" ry="105" transform="rotate(144 55 76)"/>
      <ellipse cx="-55" cy="76" rx="72" ry="105" transform="rotate(216 -55 76)"/>
      <ellipse cx="-89" cy="-27" rx="72" ry="105" transform="rotate(288 -89 -27)"/>
      <circle cx="0" cy="4" r="72"/>
    </g>
  </defs>

  <!-- white outer canvas -->
  <rect width="1248" height="1248" fill="#ffffff"/>

  <!-- rounded icon tile -->
  <rect x="77" y="86" width="1094" height="1080" rx="253" fill="url(#bg)" stroke="#f487ae" stroke-width="34"/>

  <!-- decorative rays -->
  <g stroke="#fff" stroke-width="27" stroke-linecap="round" opacity="0.97">
    <line x1="327" y1="280" x2="358" y2="328"/>
    <line x1="262" y1="347" x2="313" y2="376"/>
    <line x1="925" y1="280" x2="894" y2="328"/>
    <line x1="990" y1="347" x2="939" y2="376"/>
  </g>

  <!-- floating petals -->
  <path d="M183 456 C238 428 305 457 322 522 C287 566 224 574 190 535 C180 510 177 484 183 456 Z"
        fill="url(#pink)" opacity="0.85"/>
  <path d="M1056 512 C1017 510 969 548 947 588 C939 611 943 633 950 637 C993 644 1038 626 1056 584 C1065 562 1066 534 1056 512 Z"
        fill="url(#pink)" opacity="0.82"/>
  <path d="M617 956 C649 929 684 916 704 925 C715 969 693 1025 649 1054 C620 1060 605 1041 607 1008 C608 989 611 972 617 956 Z"
        fill="url(#pink)" opacity="0.80"/>

  <!-- top flower -->
  <g transform="translate(633 458) scale(1.33)">
    <use href="#flower" fill="#fff8fb" stroke="#fff" stroke-width="13" stroke-linejoin="round"/>
    <!-- soft pink inset -->
    <use href="#flower" fill="none" stroke="#f38eb0" stroke-width="33" stroke-linejoin="round" transform="scale(.86)"/>
    <use href="#flower" fill="#fff8fb" transform="scale(.69)"/>
  </g>

  <!-- top flower yellow center dots -->
  <g fill="url(#yellow)">
    <circle cx="637" cy="423" r="24"/>
    <circle cx="587" cy="464" r="24"/>
    <circle cx="687" cy="464" r="24"/>
    <circle cx="603" cy="523" r="24"/>
    <circle cx="668" cy="523" r="24"/>
  </g>

  <!-- bottom-left flower -->
  <g transform="translate(391 777) scale(1.07)">
    <use href="#flower" fill="url(#pink)" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <!-- bottom-left inner flower -->
  <g transform="translate(391 797) scale(.42)">
    <use href="#flower" fill="#fff8fb"/>
  </g>
  <g fill="url(#yellow)">
    <circle cx="392" cy="764" r="14"/>
    <circle cx="364" cy="789" r="13"/>
    <circle cx="420" cy="789" r="13"/>
    <circle cx="374" cy="821" r="13"/>
    <circle cx="407" cy="821" r="13"/>
  </g>

  <!-- bottom-right flower -->
  <g transform="translate(873 811) scale(.94)">
    <use href="#flower" fill="url(#purple)" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <!-- bottom-right inner flower -->
  <g transform="translate(870 835) scale(.38)">
    <use href="#flower" fill="#fff8fb"/>
  </g>
  <g fill="url(#yellow)">
    <circle cx="871" cy="806" r="13"/>
    <circle cx="846" cy="832" r="12"/>
    <circle cx="895" cy="831" r="12"/>
    <circle cx="856" cy="861" r="12"/>
    <circle cx="889" cy="860" r="12"/>
  </g>
</svg>
