<svg xmlns="http://www.w3.org/2000/svg" width="720" height="413" viewBox="0 0 720 413">
  <defs>
    <linearGradient id="pinkBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7f0"/>
      <stop offset="1" stop-color="#fff0e9"/>
    </linearGradient>

    <pattern id="motif" width="144" height="112" patternUnits="userSpaceOnUse">
      <path d="M18 24 C12 17 2 22 6 31 C10 39 18 43 18 43 C18 43 27 38 30 30 C34 21 23 17 18 24Z"
            fill="#f7b8cb" stroke="#e78da9" stroke-width="1"/>
      <polygon points="104,22 108,31 118,32 110,39 112,49 104,44 96,49 98,39 90,32 100,31"
               fill="#ffe38a" stroke="#e4bd4b" stroke-width="1"/>
      <g transform="translate(55 68)">
        <circle cx="0" cy="-7" r="7" fill="#c7d7ff" stroke="#95a9df"/>
        <circle cx="7" cy="0" r="7" fill="#c7d7ff" stroke="#95a9df"/>
        <circle cx="0" cy="7" r="7" fill="#c7d7ff" stroke="#95a9df"/>
        <circle cx="-7" cy="0" r="7" fill="#c7d7ff" stroke="#95a9df"/>
        <circle cx="0" cy="0" r="4" fill="#fff7c9"/>
        <path d="M0 10 V26 M0 19 C-8 13 -12 18 -7 23 M0 21 C7 15 12 19 7 25"
              stroke="#9fc49c" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <path d="M126 72 C123 68 116 70 118 76 C120 81 126 84 126 84 C126 84 132 81 134 76 C136 70 129 68 126 72Z"
            fill="#d9c8ee"/>
      <circle cx="78" cy="21" r="3" fill="#fff0a5"/>
      <circle cx="31" cy="91" r="3" fill="#f5c8d7"/>
    </pattern>

    <!-- One large scallop per tile. The lace body is a single closed shape;
         dots and hearts are decoration, not pieces used to fake the edge. -->
    <pattern id="topLace" width="96" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 0 H96 V16
               C88 16 86 21 82 27
               C75 38 63 42 48 42
               C33 42 21 38 14 27
               C10 21 8 16 0 16 Z"
            fill="#fff8ee"/>
      <path d="M0 16
               C8 16 10 21 14 27
               C21 38 33 42 48 42
               C63 42 75 38 82 27
               C86 21 88 16 96 16"
            fill="none" stroke="#f2bdcf" stroke-width="1.8" stroke-linecap="round"/>
      <g fill="#f3b4c8">
        <circle cx="16" cy="26" r="2.4"/>
        <circle cx="24" cy="33" r="2.4"/>
        <circle cx="34" cy="37" r="2.4"/>
        <circle cx="62" cy="37" r="2.4"/>
        <circle cx="72" cy="33" r="2.4"/>
        <circle cx="80" cy="26" r="2.4"/>
        <path d="M48 19 C43 13 34 20 48 30 C62 20 53 13 48 19Z"/>
      </g>
    </pattern>

    <pattern id="bottomLace" width="96" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 44 H96 V28
               C88 28 86 23 82 17
               C75 6 63 2 48 2
               C33 2 21 6 14 17
               C10 23 8 28 0 28 Z"
            fill="#fff8ee"/>
      <path d="M0 28
               C8 28 10 23 14 17
               C21 6 33 2 48 2
               C63 2 75 6 82 17
               C86 23 88 28 96 28"
            fill="none" stroke="#f2bdcf" stroke-width="1.8" stroke-linecap="round"/>
      <g fill="#f3b4c8">
        <circle cx="16" cy="18" r="2.4"/>
        <circle cx="24" cy="11" r="2.4"/>
        <circle cx="34" cy="7" r="2.4"/>
        <circle cx="62" cy="7" r="2.4"/>
        <circle cx="72" cy="11" r="2.4"/>
        <circle cx="80" cy="18" r="2.4"/>
        <path d="M48 25 C43 19 34 26 48 36 C62 26 53 19 48 25Z"/>
      </g>
    </pattern>
  </defs>

  <!-- Flutter owns the page background outside this transparent canvas. -->
  <rect x="0" y="22" width="720" height="369" fill="url(#pinkBg)"/>
  <rect x="0" y="42" width="720" height="327" fill="url(#motif)" opacity="0.72"/>

  <!-- Cream lace is deliberately separate from the pink field and uses
       broad scallops so it survives phone-size rasterisation cleanly. -->
  <rect x="0" y="0" width="720" height="44" fill="url(#topLace)"/>
  <rect x="0" y="369" width="720" height="44" fill="url(#bottomLace)"/>
</svg>
