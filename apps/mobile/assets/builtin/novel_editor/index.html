<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ノベルゲームメーカー</title>
  <style>
    :root {
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      color: #382b4a;
      background: #f7f1fb;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(150deg, #fff7fb, #f0e8fb 55%, #e7f5ff);
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid #d8cde4;
      background: #ffffffde;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    h1 { margin: 0; font-size: 20px; }
    h2 { margin: 0; font-size: 17px; }
    h3 { margin: 0; font-size: 14px; }

    .header-meta,
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      padding: 5px 9px;
      border-radius: 999px;
      background: #eee5f7;
      font-size: 12px;
      font-weight: 700;
    }

    #status[data-kind="error"] { background: #ffe1e1; color: #8a2222; }
    #status[data-kind="ok"] { background: #def6e7; color: #22643b; }
    #status[data-kind="dirty"] { background: #fff0c7; color: #765000; }
    #status[data-kind="waiting"] { background: #e7efff; color: #2f4f8c; }

    .primary,
    .secondary {
      min-height: 40px;
      border: 0;
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 800;
    }

    .primary { background: #76558f; color: white; }
    .secondary { background: #e7dced; color: #4a355d; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(360px, 1fr) minmax(220px, 300px);
      min-height: 0;
    }

    .pane {
      min-width: 0;
      padding: 16px;
      overflow: auto;
      border-right: 1px solid #ded4e8;
    }

    .pane:last-child { border-right: 0; }
    .pane-title { margin-bottom: 12px; }

    label {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
      font-size: 12px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #cfc1db;
      border-radius: 10px;
      background: white;
      color: inherit;
      padding: 9px 10px;
    }

    textarea { resize: vertical; line-height: 1.55; }

    #scene-list {
      display: grid;
      gap: 7px;
    }

    .scene-button {
      width: 100%;
      border: 1px solid #d7c9e1;
      border-radius: 10px;
      padding: 9px 10px;
      background: white;
      color: inherit;
      text-align: left;
      font-weight: 700;
    }

    .scene-button[data-selected="true"] {
      border-color: #76558f;
      background: #f0e5f7;
    }

    .scene-heading,
    .event-heading,
    .readonly-row,
    .choice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .scene-heading {
      margin-bottom: 12px;
    }

    .scene-heading span {
      font-size: 11px;
      color: #756582;
    }

    .event-card {
      display: grid;
      gap: 9px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #ddd1e7;
      border-radius: 14px;
      background: #fffdfd;
      box-shadow: 0 5px 16px #76558f0c;
    }

    .event-heading code,
    .readonly-row code,
    .choice-row code,
    #asset-list code {
      overflow-wrap: anywhere;
      color: #685775;
      font-size: 11px;
    }

    .readonly-row {
      justify-content: flex-start;
      font-size: 12px;
    }

    .readonly-row span { min-width: 70px; color: #756582; }
    .choice-row { align-items: flex-start; }
    .choice-row input { flex: 1; }
    .choice-row code { width: 42%; padding-top: 10px; }

    .side-card {
      margin-bottom: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #ffffffc9;
      border: 1px solid #ded4e8;
    }

    .side-card p {
      margin: 8px 0 0;
      font-size: 12px;
      line-height: 1.55;
    }

    #asset-list {
      display: grid;
      gap: 8px;
    }

    #validation[data-kind="ok"] { color: #24663c; }
    #validation[data-kind="error"] { color: #9a2d2d; }

    .preview-note {
      padding: 12px;
      border-radius: 12px;
      background: #fff3d6;
      color: #6f540f;
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 180px minmax(0, 1fr);
      }
      .pane:last-child {
        grid-column: 1 / -1;
        border-top: 1px solid #ded4e8;
      }
    }

    @media (max-width: 640px) {
      header { position: static; }
      .workspace { display: block; }
      .pane { border-right: 0; border-bottom: 1px solid #ded4e8; }
      .pane:last-child { border-bottom: 0; }
      .choice-row { display: grid; }
      .choice-row code { width: auto; padding-top: 0; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>📖 ノベルゲームメーカー</h1>
        <div class="header-meta">
          <span id="revision" class="pill">Draft -</span>
          <span id="content-revision" class="pill">Story -</span>
          <span id="status" class="pill" data-kind="waiting">ホスト接続待ち</span>
        </div>
      </div>
      <div class="actions">
        <button id="save-button" class="secondary" type="button" disabled>保存</button>
        <button id="publish-button" class="primary" type="button" disabled>公開</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="pane">
        <h2 class="pane-title">シーン</h2>
        <label>
          作品タイトル
          <input id="story-title" type="text" maxlength="100" disabled>
        </label>
        <label>
          開始シーン
          <select id="start-scene" disabled></select>
        </label>
        <div id="scene-list"></div>
      </aside>

      <section class="pane">
        <div id="event-editor">
          <p>作品を読み込んでいます。</p>
        </div>
      </section>

      <aside class="pane">
        <section class="side-card">
          <h3>検証</h3>
          <p id="validation">未読込</p>
        </section>
        <section class="side-card">
          <h3>素材</h3>
          <div id="asset-list"><p>未読込</p></div>
        </section>
        <section class="side-card">
          <h3>Preview</h3>
          <p class="preview-note">
            Editor内に別Playerは実装しません。Draft Previewは本番と同じNovel Playerを使う共通Host経路へ接続します。
          </p>
        </section>
        <section class="side-card">
          <h3>v1 Editorの安全範囲</h3>
          <p>
            stable scene/event/choice IDとgotoは表示のみです。現在編集できるのはタイトル、開始シーン、セリフ、選択肢ラベル、ENDラベルです。
          </p>
        </section>
      </aside>
    </div>
  </main>

  <script src="story-validator.js"></script>
  <script src="editor-core.js"></script>
  <script src="editor.js"></script>
</body>
</html>
