<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひみつの放課後</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      background: #f5f0ff;
      color: #34264f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(circle at 18% 16%, #fff 0 2px, transparent 3px),
        radial-gradient(circle at 83% 10%, #fff 0 3px, transparent 4px),
        linear-gradient(180deg, #7773b9 0%, #bda5d7 46%, #f7c9d7 100%);
    }

    button { font: inherit; }

    .game {
      width: min(100%, 560px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(18px, env(safe-area-inset-top))
        16px
        max(18px, env(safe-area-inset-bottom));
    }

    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: #fff;
      text-shadow: 0 2px 8px #3d315c88;
    }

    .titlebar h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 30px);
      letter-spacing: .04em;
    }

    .save-status {
      min-width: 92px;
      padding: 6px 10px;
      border: 1px solid #ffffff70;
      border-radius: 999px;
      background: #36284f55;
      font-size: 11px;
      text-align: center;
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 18px 0 12px;
    }

    .portrait-card {
      width: min(78vw, 330px);
      aspect-ratio: 4 / 5;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      border: 5px solid #fff;
      border-radius: 28px;
      background:
        radial-gradient(circle at 50% 42%, #ffe6d8 0 22%, transparent 23%),
        radial-gradient(circle at 42% 40%, #3e3154 0 2%, transparent 2.5%),
        radial-gradient(circle at 58% 40%, #3e3154 0 2%, transparent 2.5%),
        linear-gradient(155deg, #fef4ff 0%, #eadbf7 60%, #c6b0e4 100%);
      box-shadow: 0 18px 45px #34264f55;
    }

    .portrait-card::before {
      content: "";
      position: absolute;
      width: 52%;
      height: 50%;
      top: 11%;
      left: 24%;
      border-radius: 52% 52% 46% 46%;
      background: #5b466f;
      clip-path: polygon(0 0, 100% 0, 93% 62%, 80% 35%, 68% 70%, 50% 34%, 35% 66%, 20% 34%, 5% 63%);
      opacity: .92;
    }

    .portrait-card::after {
      content: "ここを顔イラスト1枚に変えてOK";
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 15px;
      padding: 7px 10px;
      border-radius: 999px;
      background: #ffffffd9;
      color: #695078;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }

    .face-mark {
      position: relative;
      z-index: 2;
      margin-top: 12%;
      font-size: clamp(48px, 17vw, 82px);
      filter: drop-shadow(0 4px 8px #6f4d7150);
    }

    .dialogue {
      border: 4px solid #fff;
      border-radius: 24px;
      background: #fffdf7f2;
      box-shadow: 0 10px 28px #34264f45;
      overflow: hidden;
    }

    .speaker {
      display: inline-block;
      margin: 0 0 0 18px;
      padding: 7px 15px;
      border-radius: 14px 14px 0 0;
      background: #664c83;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      transform: translateY(-1px);
    }

    .text {
      min-height: 84px;
      margin: 0;
      padding: 16px 18px 12px;
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 650;
      line-height: 1.65;
      white-space: pre-line;
    }

    .choices {
      display: grid;
      gap: 9px;
      padding: 0 14px 15px;
    }

    .choice,
    .restart {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      background: #7a5a99;
      box-shadow: 0 4px 0 #4f3969;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .choice:active,
    .restart:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4f3969;
    }

    .choice:focus-visible,
    .restart:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 2px;
    }

    .restart {
      background: #a06b83;
      box-shadow: 0 4px 0 #74495d;
    }

    .end-mark {
      padding: 0 14px 11px;
      color: #8a6a78;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-align: center;
    }

    @media (min-width: 700px) {
      .game { padding-left: 24px; padding-right: 24px; }
      .portrait-card { width: 300px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="titlebar">
      <h1 id="game-title">ひみつの放課後</h1>
      <div id="save-status" class="save-status" aria-live="polite">セーブ確認中</div>
    </header>

    <section class="stage" aria-label="キャラクター">
      <!--
        AIで改造するとき:
        この portrait-card の中身を <img src="face.png" alt="ミオ"> に変えるだけでもOK。
        顔イラスト1枚だけで画面が成立するようにしてあります。
      -->
      <div class="portrait-card" id="portrait">
        <div class="face-mark" id="face-mark" aria-hidden="true">☺</div>
      </div>
    </section>

    <section class="dialogue" aria-live="polite">
      <div id="speaker" class="speaker">ミオ</div>
      <p id="text" class="text"></p>
      <div id="end-mark" class="end-mark" hidden>END</div>
      <div id="choices" class="choices"></div>
    </section>
  </main>

  <script>
    'use strict';

    // ============================================================
    // AIで改造するなら、まずここだけ変えればお話を作れます。
    // title: タイトル
    // speaker: 話している人
    // face: 顔の代わりの記号（画像に変えてもOK）
    // text: セリフ
    // choices: 選択肢。to に移動先の scene 名を書く
    // end: true ならエンディング
    // ============================================================
    const GAME_TITLE = 'ひみつの放課後';

    const SCENES = {
      start: {
        speaker: 'ミオ',
        face: '☺',
        text: 'ねえ。\n今日、ちょっとだけ寄り道していかない？',
        choices: [
          { label: '「どうしたの？」', to: 'rooftop' },
          { label: '「今日は帰るね」', to: 'leave' },
        ],
      },
      rooftop: {
        speaker: 'ミオ',
        face: '☻',
        text: '屋上の空、すごくきれいだったから。\nきみに見せたかったんだ。',
        choices: [
          { label: 'となりに座る', to: 'together' },
          { label: '空の写真を撮る', to: 'photo' },
        ],
      },
      together: {
        speaker: 'ミオ',
        face: '♥',
        text: '……えへへ。\nこの場所、ふたりだけの秘密にしようね。',
        choices: [],
        end: true,
      },
      photo: {
        speaker: 'ミオ',
        face: '★',
        text: 'じゃあ同じ空を持って帰れるね。\n明日も、ここで会おう。',
        choices: [],
        end: true,
      },
      leave: {
        speaker: 'ミオ',
        face: '・',
        text: 'そっか。じゃあ、また明日。\n次はちゃんと誘うからね。',
        choices: [],
        end: true,
      },
    };

    const SAVE_KEY = 'novel_progress';
    let currentScene = 'start';
    let bridgeReadyHandled = false;

    const titleElement = document.getElementById('game-title');
    const speakerElement = document.getElementById('speaker');
    const textElement = document.getElementById('text');
    const faceElement = document.getElementById('face-mark');
    const choicesElement = document.getElementById('choices');
    const endMarkElement = document.getElementById('end-mark');
    const saveStatusElement = document.getElementById('save-status');

    titleElement.textContent = GAME_TITLE;

    function hasMinAppState() {
      return Boolean(
        window.minapp &&
        window.minapp.version === 1 &&
        window.minapp.state &&
        typeof window.minapp.state.get === 'function' &&
        typeof window.minapp.state.set === 'function' &&
        typeof window.minapp.state.delete === 'function'
      );
    }

    function setSaveStatus(text) {
      saveStatusElement.textContent = text;
    }

    function renderScene(sceneId) {
      const scene = SCENES[sceneId];
      if (!scene) {
        throw new Error(`Unknown scene: ${sceneId}`);
      }

      currentScene = sceneId;
      speakerElement.textContent = scene.speaker;
      textElement.textContent = scene.text;
      faceElement.textContent = scene.face;
      endMarkElement.hidden = scene.end !== true;
      choicesElement.replaceChildren();

      for (const choice of scene.choices) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';
        button.textContent = choice.label;
        button.addEventListener('click', () => choose(choice.to));
        choicesElement.appendChild(button);
      }

      if (scene.end === true) {
        const restart = document.createElement('button');
        restart.type = 'button';
        restart.className = 'restart';
        restart.textContent = 'はじめから読む';
        restart.addEventListener('click', restartStory);
        choicesElement.appendChild(restart);
      }
    }

    async function choose(nextScene) {
      renderScene(nextScene);
      await saveProgress();
    }

    async function saveProgress() {
      if (!hasMinAppState()) {
        setSaveStatus('この環境はセーブなし');
        return;
      }

      try {
        await window.minapp.state.set(SAVE_KEY, { scene: currentScene });
        setSaveStatus('セーブしました');
      } catch (error) {
        const code = error && typeof error.code === 'string' ? error.code : 'unknown_error';
        setSaveStatus(`保存失敗: ${code}`);
      }
    }

    async function restoreProgress() {
      if (!hasMinAppState()) {
        setSaveStatus('この環境はセーブなし');
        return;
      }

      try {
        const saved = await window.minapp.state.get(SAVE_KEY);
        if (saved && typeof saved.scene === 'string' && SCENES[saved.scene]) {
          renderScene(saved.scene);
          setSaveStatus('つづきから');
          return;
        }
        setSaveStatus('はじめから');
      } catch (error) {
        if (error && error.code === 'state_not_found') {
          setSaveStatus('はじめから');
          return;
        }
        const code = error && typeof error.code === 'string' ? error.code : 'unknown_error';
        setSaveStatus(`読込失敗: ${code}`);
      }
    }

    async function restartStory() {
      renderScene('start');
      if (!hasMinAppState()) {
        setSaveStatus('この環境はセーブなし');
        return;
      }

      try {
        await window.minapp.state.delete(SAVE_KEY);
        setSaveStatus('はじめから');
      } catch (error) {
        if (error && error.code === 'state_not_found') {
          setSaveStatus('はじめから');
          return;
        }
        const code = error && typeof error.code === 'string' ? error.code : 'unknown_error';
        setSaveStatus(`削除失敗: ${code}`);
      }
    }

    async function onMinAppReady() {
      if (bridgeReadyHandled) return;
      bridgeReadyHandled = true;
      await restoreProgress();
    }

    window.addEventListener('minappready', onMinAppReady);

    renderScene('start');
    if (hasMinAppState()) {
      onMinAppReady();
    } else {
      setSaveStatus('この環境はセーブなし');
    }
  </script>
</body>
</html>
