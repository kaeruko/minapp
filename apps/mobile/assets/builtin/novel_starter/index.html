<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひみつの放課後</title>
  <style>
    :root { font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif; color:#3f3154; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body { min-height:100dvh; background:linear-gradient(#7b75ae,#d8add0 58%,#f8cfda); }
    .app { width:min(100%,640px); min-height:100dvh; margin:auto; padding:18px 14px 24px; display:grid; grid-template-rows:auto minmax(330px,1fr) auto; gap:12px; }
    header { color:white; text-align:center; }
    h1 { margin:0; font-size:25px; }
    .stage { position:relative; overflow:hidden; border:4px solid #fff; border-radius:28px; background:linear-gradient(#8b82bd 0 55%,#e7b5cc 55% 100%); box-shadow:0 16px 36px #35284b55; }
    .sky { position:absolute; inset:0; display:grid; place-items:center; font-size:82px; opacity:.9; }
    .character { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:190px; height:265px; border-radius:95px 95px 22px 22px; background:linear-gradient(#5f4b67 0 33%,#f6d7ca 33% 52%,#7585c7 52% 100%); border:5px solid #fff; box-shadow:0 12px 22px #35284b55; }
    .character::before { content:"レン"; position:absolute; inset:76px 0 auto; text-align:center; color:#4a344e; font-weight:900; font-size:18px; }
    .dialogue { border:4px solid #fff; border-radius:22px; background:#fffdf8f2; overflow:hidden; box-shadow:0 10px 28px #35284b40; }
    #speaker { display:inline-block; padding:7px 14px; background:#6d5288; color:#fff; font-weight:900; }
    #text { min-height:88px; margin:0; padding:14px 16px; font-size:17px; font-weight:700; line-height:1.6; white-space:pre-line; }
    #choices { display:grid; gap:8px; padding:0 12px 13px; }
    button { min-height:46px; border:0; border-radius:14px; padding:10px 14px; background:#785a96; color:#fff; font-weight:900; box-shadow:0 4px 0 #503d67; }
    button:active { transform:translateY(3px); box-shadow:0 1px 0 #503d67; }
    .end { text-align:center; padding:0 12px 12px; font-weight:900; color:#8a5f7a; }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>ひみつの放課後</h1></header>
    <section class="stage" aria-label="ノベルゲーム画面"><div class="sky">☁️</div><div class="character"></div></section>
    <section class="dialogue">
      <div id="speaker">レン</div>
      <p id="text"></p>
      <div id="choices"></div>
      <div id="end" class="end" hidden></div>
    </section>
  </main>
  <script>
    'use strict';
    const text = document.getElementById('text');
    const choices = document.getElementById('choices');
    const end = document.getElementById('end');
    const scenes = Object.freeze({
      start: Object.freeze({
        text: 'なあ。\n今日、ちょっとだけ寄り道していかない？',
        choices: Object.freeze([
          Object.freeze({label:'「どうしたの？」', next:'rooftop'}),
          Object.freeze({label:'「今日は帰るね」', next:'leave'}),
        ]),
      }),
      rooftop: Object.freeze({
        text: '屋上の空、すごくきれいだったから。\nきみに見せたかったんだ。',
        choices: Object.freeze([
          Object.freeze({label:'となりに座る', next:'together'}),
          Object.freeze({label:'空の写真を撮る', next:'photo'}),
        ]),
      }),
      together: Object.freeze({text:'……よかった。\nこの場所、ふたりだけの秘密にしよう。', ending:'END - ふたりの秘密'}),
      photo: Object.freeze({text:'じゃあ同じ空を持って帰れるね。\n明日も、ここで会おう。', ending:'END - 同じ空'}),
      leave: Object.freeze({text:'そっか。じゃあ、また明日。\n次はちゃんと誘うから。', ending:'END - また明日'}),
    });
    function render(id) {
      const scene = scenes[id];
      if (!scene) throw new Error(`Unknown scene: ${id}`);
      text.textContent = scene.text;
      choices.replaceChildren();
      end.hidden = true;
      if (scene.ending) {
        end.textContent = scene.ending;
        end.hidden = false;
        const restart = document.createElement('button');
        restart.type = 'button';
        restart.textContent = 'はじめから読む';
        restart.addEventListener('click', () => render('start'));
        choices.appendChild(restart);
        return;
      }
      for (const choice of scene.choices) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = choice.label;
        button.addEventListener('click', () => render(choice.next));
        choices.appendChild(button);
      }
    }
    render('start');
  </script>
</body>
</html>
