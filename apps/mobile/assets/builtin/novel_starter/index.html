<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ひみつの放課後</title>
  <style>
    :root {
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      color: #35284b;
      background: #8877b6;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    button { font: inherit; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(#7770ae, #c9a6cf 55%, #f4c5d4);
    }

    .game {
      width: min(100%, 720px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: auto;
      display: grid;
      grid-template-rows: auto minmax(320px, 1fr) auto;
      gap: 12px;
      padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      color: white;
    }

    h1 { margin: 0; font-size: clamp(20px, 5vw, 28px); }

    #save-status {
      padding: 6px 9px;
      border-radius: 999px;
      background: #3e315d66;
      font-size: 11px;
      text-align: center;
    }

    .stage-wrap {
      position: relative;
      min-height: 0;
    }

    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 4px solid #ffffffd9;
      border-radius: 28px;
      background-color: #b9a6d2;
      background-image: linear-gradient(#8b82bd, #e4aec8);
      background-size: cover;
      background-position: center;
      box-shadow: 0 16px 36px #35284b55;
    }

    .character {
      position: absolute;
      bottom: 0;
      width: min(44%, 280px);
      max-height: 92%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 12px 14px #35284b66);
    }

    .character[hidden] { display: none; }
    .character[data-character-slot="left"] { left: 1%; }
    .character[data-character-slot="center"] { left: 50%; transform: translateX(-50%); }
    .character[data-character-slot="right"] { right: 1%; }

    .start-overlay,
    .fatal {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      border-radius: 28px;
      background: #35284bd9;
      color: white;
      text-align: center;
    }

    .start-overlay[hidden], .fatal[hidden] { display: none; }
    .start-overlay p, .fatal p { margin: 0; line-height: 1.6; }

    .dialogue {
      overflow: hidden;
      border: 4px solid white;
      border-radius: 22px;
      background: #fffdf8f2;
      box-shadow: 0 10px 28px #35284b40;
    }

    #speaker {
      display: inline-block;
      padding: 7px 14px;
      background: #6d5288;
      color: white;
      font-size: 14px;
      font-weight: 800;
    }

    #speaker[hidden] { display: none; }

    #text {
      min-height: 78px;
      margin: 0;
      padding: 14px 16px 10px;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.6;
      white-space: pre-line;
    }

    #text.clickable { cursor: pointer; }
    #text.clickable::after { content: "  ▼"; font-size: 12px; }

    #choices {
      display: grid;
      gap: 8px;
      padding: 0 12px 13px;
    }

    .choice, .restart, .primary, .secondary, .danger {
      min-height: 46px;
      border: 0;
      border-radius: 14px;
      padding: 10px 14px;
      background: #785a96;
      box-shadow: 0 4px 0 #503d67;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    .choice:active, .restart:active, .primary:active, .secondary:active, .danger:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #503d67;
    }

    .secondary { background: #6c799c; }
    .restart, .danger { background: #a36e85; }
    #end { padding: 0 12px 10px; text-align: center; font-size: 13px; font-weight: 900; }
    #fatal-message { max-width: 560px; overflow-wrap: anywhere; }

    @media (max-width: 520px) {
      .game { grid-template-rows: auto minmax(280px, 1fr) auto; }
      .character { width: 52%; }
      #text { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <h1 id="title">ノベルを読み込み中</h1>
      <div id="save-status" aria-live="polite">初期化中</div>
    </header>

    <section class="stage-wrap" aria-label="ノベルゲーム画面">
      <div id="stage" class="stage">
        <img class="character" data-character-slot="left" hidden alt="">
        <img class="character" data-character-slot="center" hidden alt="">
        <img class="character" data-character-slot="right" hidden alt="">
      </div>

      <div id="start-overlay" class="start-overlay">
        <p>物語をはじめます</p>
        <button id="start-button" class="primary" type="button">はじめから</button>
        <button id="continue-button" class="secondary" type="button" hidden>つづきから</button>
      </div>

      <div id="fatal" class="fatal" hidden role="alert">
        <p>この作品を再生できません。</p>
        <p id="fatal-message"></p>
        <button id="reset-save-button" class="danger" type="button" hidden>セーブを消して最初から</button>
      </div>
    </section>

    <section class="dialogue" aria-live="polite">
      <div id="speaker" hidden></div>
      <p id="text"></p>
      <div id="end" hidden>END</div>
      <div id="choices"></div>
    </section>
  </main>

  <!--
    v1では story.json の fetch を前提にしない。
    Publish時のcompilerは、このapplication/json要素へMaster Dataを安全に埋め込む。
  -->
  <script id="minapp-novel-story" type="application/json">
  {
    "content_format": "minapp/novel@1",
    "schema_version": 1,
    "content_revision": 1,
    "title": "ひみつの放課後",
    "start_scene": "start",
    "assets": {
      "ren-face": {
        "kind": "image",
        "src": "face.jpg",
        "mime": "image/jpeg",
        "alt": "レン"
      }
    },
    "characters": {
      "ren": {
        "name": "レン",
        "expressions": {
          "normal": "ren-face"
        }
      }
    },
    "scenes": {
      "start": {
        "id": "start",
        "events": [
          {
            "id": "evt-start-ren",
            "type": "character",
            "action": "show",
            "slot": "center",
            "character": "ren",
            "expression": "normal"
          },
          {
            "id": "evt-start-line",
            "type": "dialogue",
            "speaker": "ren",
            "text": "なあ。\n今日、ちょっとだけ寄り道していかない？"
          },
          {
            "id": "evt-start-choice",
            "type": "choice",
            "options": [
              { "id": "ask", "label": "「どうしたの？」", "goto": "rooftop" },
              { "id": "leave", "label": "「今日は帰るね」", "goto": "leave" }
            ]
          }
        ]
      },
      "rooftop": {
        "id": "rooftop",
        "events": [
          {
            "id": "evt-rooftop-line",
            "type": "dialogue",
            "speaker": "ren",
            "text": "屋上の空、すごくきれいだったから。\nきみに見せたかったんだ。"
          },
          {
            "id": "evt-rooftop-choice",
            "type": "choice",
            "options": [
              { "id": "sit", "label": "となりに座る", "goto": "together" },
              { "id": "photo", "label": "空の写真を撮る", "goto": "photo" }
            ]
          }
        ]
      },
      "together": {
        "id": "together",
        "events": [
          {
            "id": "evt-together-line",
            "type": "dialogue",
            "speaker": "ren",
            "text": "……よかった。\nこの場所、ふたりだけの秘密にしよう。"
          },
          { "id": "evt-together-end", "type": "end", "label": "END - ふたりの秘密" }
        ]
      },
      "photo": {
        "id": "photo",
        "events": [
          {
            "id": "evt-photo-line",
            "type": "dialogue",
            "speaker": "ren",
            "text": "じゃあ同じ空を持って帰れるね。\n明日も、ここで会おう。"
          },
          { "id": "evt-photo-end", "type": "end", "label": "END - 同じ空" }
        ]
      },
      "leave": {
        "id": "leave",
        "events": [
          {
            "id": "evt-leave-line",
            "type": "dialogue",
            "speaker": "ren",
            "text": "そっか。じゃあ、また明日。\n次はちゃんと誘うから。"
          },
          { "id": "evt-leave-end", "type": "end", "label": "END - また明日" }
        ]
      }
    }
  }
  </script>
  <script src="story-validator.js"></script>
  <script src="player.js"></script>
</body>
</html>
