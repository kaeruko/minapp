<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>マイメモ帳</title>
  <style>
    :root {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      color: #4f4348;
      background: #fffaf7;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    button, textarea { font: inherit; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #fffaf7;
    }

    .app {
      width: min(100%, 680px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 44px;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .clear-button {
      border: 1px solid #e8d8de;
      border-radius: 999px;
      background: #fff;
      color: #8b6c77;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .clear-button:active { transform: translateY(1px); }

    .memo {
      width: 100%;
      flex: 1;
      min-height: 0;
      resize: none;
      border: 1px solid #eadfe3;
      border-radius: 18px;
      outline: none;
      background: #fff;
      color: #493e42;
      padding: 18px;
      font-size: 16px;
      line-height: 1.75;
      box-shadow: 0 6px 20px #8e687010;
    }

    .memo:focus {
      border-color: #e4bccb;
      box-shadow: 0 0 0 3px #f8dce766;
    }

    .memo::placeholder { color: #bcaeb3; }

    .status {
      min-height: 18px;
      margin: 0;
      padding: 0 4px;
      color: #9b8990;
      font-size: 11px;
      text-align: right;
    }

    .status.error {
      color: #b44f60;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <h1>マイメモ帳</h1>
      <button id="clear-button" class="clear-button" type="button" disabled>ぜんぶ消す</button>
    </div>

    <textarea
      id="memo"
      class="memo"
      aria-label="メモ"
      placeholder="ここにメモしてね"
      readonly
      autofocus
    ></textarea>

    <p id="status" class="status" aria-live="polite">読み込み中…</p>
  </main>

  <script>
    'use strict';

    const STORAGE_KEY = 'minapp_memo_pad_v1';
    const builtInStatePending = new Map();
    let builtInStateSequence = 0;
    let loaded = false;
    let storageFailed = false;
    let revision = 0;
    const useBuiltInState = Boolean(
      window.MinAppBuiltinState &&
      typeof window.MinAppBuiltinState.postMessage === 'function'
    );

    const memo = document.getElementById('memo');
    const clearButton = document.getElementById('clear-button');
    const status = document.getElementById('status');

    if (!(memo instanceof HTMLTextAreaElement)) {
      throw new Error('memo textarea was not found');
    }
    if (!(clearButton instanceof HTMLButtonElement)) {
      throw new Error('clear button was not found');
    }
    if (!(status instanceof HTMLElement)) {
      throw new Error('status element was not found');
    }

    function requestBuiltInState(method, key, value) {
      const id = `memo-pad-${++builtInStateSequence}`;
      const request = { version: 1, id, method, key };
      if (method === 'set') request.value = value;
      return new Promise((resolve, reject) => {
        const timeout = window.setTimeout(() => {
          builtInStatePending.delete(id);
          reject(new Error('保存先から応答がありません。開き直してください。'));
        }, 10000);
        builtInStatePending.set(id, { resolve, reject, timeout });
        try {
          window.MinAppBuiltinState.postMessage(JSON.stringify(request));
        } catch (error) {
          window.clearTimeout(timeout);
          builtInStatePending.delete(id);
          reject(error);
        }
      });
    }

    window.__minappBuiltinStateResolve = (response) => {
      if (!response || typeof response.id !== 'string') {
        for (const pending of builtInStatePending.values()) {
          window.clearTimeout(pending.timeout);
          pending.reject(new Error('保存先からの応答が不正です。'));
        }
        builtInStatePending.clear();
        return;
      }
      const pending = builtInStatePending.get(response.id);
      if (!pending) return; // A response may arrive after its request timed out.
      window.clearTimeout(pending.timeout);
      builtInStatePending.delete(response.id);
      if (response.version !== 1 || typeof response.ok !== 'boolean') {
        pending.reject(new Error('保存先からの応答が不正です。'));
      } else if (!response.ok) {
        pending.reject(new Error(response.error || '端末への保存に失敗しました。'));
      } else {
        pending.resolve(response);
      }
    };

    function showStorageError(error, loading = false) {
      storageFailed = true;
      memo.readOnly = true;
      clearButton.disabled = true;
      status.classList.add('error');
      status.textContent = `${loading ? '読み込み' : '保存'}できませんでした。表示中のメモをコピーしてから開き直してください。 ${error instanceof Error ? error.message : String(error)}`;
    }

    function validateMemo(value) {
      if (typeof value !== 'string') throw new Error('保存されたメモが不正です。');
      return value;
    }

    async function writeMemo(value) {
      if (useBuiltInState) {
        await requestBuiltInState('set', STORAGE_KEY, value);
      } else {
        window.localStorage.setItem(STORAGE_KEY, value);
      }
    }

    async function loadMemo() {
      memo.readOnly = true;
      clearButton.disabled = true;
      try {
        if (useBuiltInState) {
          const saved = await requestBuiltInState('get', STORAGE_KEY);
          if (saved.found === true && Object.prototype.hasOwnProperty.call(saved, 'value')) {
            memo.value = validateMemo(saved.value);
          } else if (saved.found === false) {
            // Only import when native storage has never held a memo. An empty
            // native string is an intentional deletion and must stay empty.
            const legacy = window.localStorage.getItem(STORAGE_KEY);
            memo.value = legacy === null ? '' : validateMemo(legacy);
            if (legacy !== null) await writeMemo(memo.value);
          } else {
            throw new Error('保存先からの応答が不正です。');
          }
        } else {
          const saved = window.localStorage.getItem(STORAGE_KEY);
          memo.value = saved === null ? '' : validateMemo(saved);
        }
        loaded = true;
        memo.readOnly = false;
        clearButton.disabled = false;
        status.textContent = '自動保存';
      } catch (error) {
        showStorageError(error, true);
      }
    }

    function saveMemo() {
      if (!loaded || storageFailed) return;
      const value = memo.value;
      const savedRevision = ++revision;
      status.textContent = '保存中…';
      // Hand off every snapshot during the input event. The native store owns
      // the FIFO across page lifetimes; a JS queue would lose unsent edits when
      // this WebView closes. Earlier acknowledgements never mark newer text saved.
      writeMemo(value).then(() => {
        if (!storageFailed && savedRevision === revision) status.textContent = '保存しました';
      }).catch((error) => showStorageError(error));
    }

    function clearMemo() {
      if (!loaded || storageFailed) return;
      if (!window.confirm('メモをぜんぶ消す？')) {
        return;
      }

      memo.value = '';
      saveMemo();
      memo.focus();
    }

    memo.addEventListener('input', saveMemo);
    clearButton.addEventListener('click', clearMemo);

    loadMemo();
  </script>
</body>
</html>
