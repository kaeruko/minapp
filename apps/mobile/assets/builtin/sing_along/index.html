<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>うたってみよう</title>
  <style>
    :root {
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      color: #5f4b66;
      background: #fff6fb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    button, select { font: inherit; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: linear-gradient(180deg, #ffe7f2 0%, #f2eaff 48%, #fff4dc 100%);
    }
    .app {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    header { text-align: center; margin-bottom: 14px; }
    h1 { margin: 0; font-size: 29px; color: #7d5d9b; }
    .subtitle { margin: 7px 0 0; font-size: 13px; color: #8d7894; }
    .stage {
      min-height: 130px;
      display: grid;
      place-items: center;
      border: 4px solid #fff;
      border-radius: 28px;
      background: linear-gradient(135deg, #ffd5e7, #dcd1ff 58%, #d8f5e5);
      box-shadow: 0 10px 28px #8d73a52b;
      text-align: center;
    }
    .mic { font-size: 54px; }
    .friends { font-size: 25px; letter-spacing: 7px; }
    .stage-note { margin-top: 4px; font-size: 12px; font-weight: 800; color: #725b7a; }
    .card {
      margin-top: 14px;
      padding: 16px;
      border: 3px solid #fff;
      border-radius: 24px;
      background: #ffffffd9;
      box-shadow: 0 8px 22px #8d73a520;
    }
    .label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 900; color: #765b82; }
    select {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      border: 2px solid #e3d8ef;
      border-radius: 15px;
      background: white;
      color: #5f4b66;
      font-weight: 800;
    }
    .track-info { min-height: 38px; margin: 9px 2px 0; font-size: 12px; line-height: 1.55; color: #816f88; }
    .time-row { display: flex; justify-content: space-between; align-items: center; margin: 13px 2px 8px; font-weight: 900; }
    .timer { font-size: 23px; color: #7b5d97; font-variant-numeric: tabular-nums; }
    .limit { font-size: 13px; color: #9d879e; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      min-height: 52px;
      border: 0;
      border-radius: 17px;
      padding: 9px 10px;
      font-weight: 900;
      color: #5d4964;
      cursor: pointer;
    }
    button:disabled { opacity: .42; cursor: default; }
    .preview { background: #d9efff; }
    .record { background: #ffc9d9; }
    .stop { background: #ffe3b6; }
    .play { background: #d5f2de; }
    .delete { grid-column: 1 / -1; background: #f0e9f7; }
    .status { min-height: 44px; margin-top: 13px; padding: 10px 12px; border-radius: 14px; background: #f8f3fb; font-size: 12px; line-height: 1.5; }
    .status.error { background: #fff0f2; color: #a14358; }
    .tip { margin: 12px 0 0; padding: 11px 13px; border-radius: 16px; background: #fff8ce; color: #776c3e; font-size: 12px; font-weight: 800; line-height: 1.5; }
    .privacy { margin: 10px 2px 0; font-size: 11px; color: #95879a; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>🎤 うたってみよう</h1>
      <p class="subtitle">すきな曲や伴奏にあわせて、じぶんの声をろくおんしよう</p>
    </header>

    <section class="stage" aria-label="うたのステージ">
      <div>
        <div class="mic">🎙️</div>
        <div class="friends">🐶 🐻 🐰</div>
        <div class="stage-note">みんながおうえんしてるよ！</div>
      </div>
    </section>

    <section class="card">
      <label class="label" for="track">🎵 曲・BGMをえらぶ</label>
      <select id="track">
        <option value="jupiter">木星（ホルスト）</option>
        <option value="mozart-25">交響曲第25番（モーツァルト）</option>
        <option value="clair-de-lune">月の光（ドビュッシー）</option>
        <option value="sparkle">きらきらポップ</option>
        <option value="after-school">放課後バラード</option>
        <option value="idol-step">アイドルステップ</option>
      </select>
      <p id="track-info" class="track-info"></p>

      <div class="time-row">
        <span id="timer" class="timer">00:00</span>
        <span id="limit" class="limit">最大 01:00</span>
      </div>

      <div class="buttons">
        <button id="preview" class="preview">▶ BGMをきく</button>
        <button id="record" class="record">🔴 ろくおん</button>
        <button id="stop" class="stop" disabled>■ とめる</button>
        <button id="play" class="play" disabled>▶ BGM＋うた</button>
        <button id="delete" class="delete" disabled>🗑 とりなおす</button>
      </div>

      <div id="status" class="status" role="status" aria-live="polite">マイクは「ろくおん」を押したときだけ使います。</div>
      <p class="tip">🎧 イヤホンがおすすめだよ。スピーカーのBGMをマイクが拾いにくくなるよ。</p>
      <p class="privacy">録音した声はこの画面の中だけで使い、サーバーには送信しません。画面を閉じると録音は消えます。</p>
      <p class="privacy">🎵 自分で作った曲や、利用が許可されている音楽を使ってね。市販の曲など、他の人が権利を持つ音楽をアップロード・共有するときは、必要な許可を確認してください。</p>
    </section>
  </main>

  <script>
    'use strict';

    const MAX_SECONDS = 60;
    const BGM_MASTER_GAIN = 3.0;
    const BGM_OUTPUT_GAIN = 1.35;
    const BGM_LOOKAHEAD_SECONDS = 1.5;
    const BGM_SCHEDULER_INTERVAL_MS = 200;
    const AUDIO_CLOCK_STALL_MS = 1800;
    const TONE_FLOOR_GAIN = 0.0001;
    const TONE_SUSTAIN_RATIO = 0.72;
    const TONE_ATTACK_SECONDS = 0.015;
    const TONE_RELEASE_SECONDS = 0.055;
    // Holst, The Planets (1921 score), Jupiter, Andante maestoso:
    // first seven complete bars after the G3/Bb3 pickup (printed p.91).
    // Each pair is [MIDI note, quarter-note beats]; tied notes are combined.
    // The eighth bar's Eb4 closes the phrase (printed p.92).
    // Source and our repeat/cadence edits: sing_along/README.md.
    const JUPITER_THEME = Object.freeze([
      [60, 1.5], [63, 0.5], [62, 0.75], [58, 0.25],
      [63, 0.5], [65, 0.5], [63, 1], [62, 1],
      [60, 0.5], [62, 0.5], [60, 1], [58, 1],
      [55, 2], [55, 0.5], [58, 0.5],
      [60, 1.5], [63, 0.5], [62, 0.75], [58, 0.25],
      [63, 0.5], [65, 0.5], [67, 1], [67, 1],
      [67, 0.5], [65, 0.5], [63, 1], [65, 1],
    ]);
    // Our own simple accompaniment, one chord per 3/4 bar.
    const JUPITER_CHORDS = Object.freeze([
      [[48, 55, 58, 63], 3], [[51, 58, 63, 67], 3],
      [[44, 51, 56, 60], 3], [[39, 51, 55, 58], 3],
      [[48, 55, 58, 63], 3], [[43, 51, 58, 63], 3],
      [[46, 53, 56, 62], 3], [[39, 51, 55, 58], 3],
    ]);
    // Mozart, Symphony No.25 K.183, I: opening five-bar incipit on IMSLP.
    // Preserve the 8th/quarter-note syncopation and the bar-5 arpeggio,
    // transposed down one octave. Repeats and the held closing G are ours.
    // This uses Mozart's theme, not the modern CM work "HASSIN".
    // Score provenance and the exact LilyPond incipit: sing_along/README.md.
    const MOZART_25_THEME = Object.freeze([
      [67, 0.5], [67, 1], [67, 1], [67, 1], [67, 0.5],
      [62, 0.5], [62, 1], [62, 1], [62, 1], [62, 0.5],
      [63, 0.5], [63, 1], [63, 1], [63, 1], [63, 0.5],
      [54, 0.5], [54, 1], [54, 1], [54, 1], [54, 0.5],
      [55, 0.5], [58, 0.5], [62, 0.5], [67, 0.5],
      [70, 0.25], [69, 0.25], [67, 0.25], [66, 0.25], [67, 1],
    ]);
    // Original, simplified accompaniment: G minor, D, C minor, D7, G minor.
    const MOZART_25_CHORDS = Object.freeze([
      [[43, 50, 58], 4], [[38, 45, 54], 4], [[48, 55, 63], 4],
      [[38, 54, 60], 4], [[43, 50, 58], 4],
    ]);
    // Debussy, Clair de lune: upper voice of bars 1-4, down one octave.
    // Source: Keith OHara's public-domain Mutopia 1778 / E. Fromont (1905).
    // Durations use quarter-note beats; null is an explicit rest. Tied notes
    // and the 9/8 bar-3 duplets are combined without reattacking the note.
    // Our repeat and held Db cadence are documented in sing_along/README.md.
    const CLAIR_DE_LUNE_THEME = Object.freeze([
      [null, 0.5], [56, 0.5], [68, 2], [65, 2],
      [63, 0.5], [65, 0.5], [63, 3.5],
      [61, 0.5], [63, 0.5], [61, 0.75], [65, 1.5], [61, 1.25],
      [60, 0.5], [61, 0.5], [60, 3],
    ]);
    // Our simplified accompaniment, including the opening eighth-note rest.
    const CLAIR_DE_LUNE_CHORDS = Object.freeze([
      [null, 0.5], [[49, 56, 65], 4], [[51, 58, 61], 4.5],
      [[44, 54, 60], 4.5], [[49, 56, 65], 4.5],
    ]);
    const TRACKS = Object.freeze({
      jupiter: Object.freeze({
        kind: 'score',
        bpm: 76,
        leadInBeats: 2,
        description: 'ホルスト「木星」の有名な中間部。2つの合図のあと、ラララで短い旋律を2回うたおう。',
        melody: [[55, 0.5], [58, 0.5], ...JUPITER_THEME,
          [63, 2], [55, 0.5], [58, 0.5], ...JUPITER_THEME, [63, 3]],
        harmony: [[[46, 55, 58], 1], ...JUPITER_CHORDS, ...JUPITER_CHORDS],
      }),
      'mozart-25': Object.freeze({
        kind: 'score',
        bpm: 128,
        leadInBeats: 4,
        description: 'モーツァルト「交響曲第25番」第1楽章の冒頭。4つの合図のあと、ラララで短い旋律を3回うたおう。',
        melody: [...MOZART_25_THEME, ...MOZART_25_THEME, ...MOZART_25_THEME, [67, 4]],
        harmony: [...MOZART_25_CHORDS, ...MOZART_25_CHORDS, ...MOZART_25_CHORDS, [[43, 50, 58], 4]],
      }),
      'clair-de-lune': Object.freeze({
        kind: 'score',
        bpm: 72,
        leadInBeats: 4.5,
        countInPulseBeats: 1.5,
        description: 'ドビュッシー「月の光」の静かな冒頭。3つの合図のあと、ラララで短い旋律を2回うたおう。',
        melody: [...CLAIR_DE_LUNE_THEME, ...CLAIR_DE_LUNE_THEME, [61, 1.5]],
        harmony: [...CLAIR_DE_LUNE_CHORDS, ...CLAIR_DE_LUNE_CHORDS, [[49, 56, 65], 1.5]],
      }),
      sparkle: Object.freeze({
        kind: 'loop',
        bpm: 124,
        description: '明るくて軽いポップ。自由にメロディをのせてみよう。',
        root: 60,
        chords: [[0, 4, 7], [9, 12, 16], [5, 9, 12], [7, 11, 14]],
        wave: 'triangle',
      }),
      'after-school': Object.freeze({
        kind: 'loop',
        bpm: 82,
        description: 'ゆっくり歌える、やさしい放課後の伴奏。',
        root: 53,
        chords: [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]],
        wave: 'sine',
      }),
      'idol-step': Object.freeze({
        kind: 'loop',
        bpm: 148,
        description: '元気に歌いたいときの、はずむアイドル風伴奏。',
        root: 55,
        chords: [[0, 4, 7], [5, 9, 12], [9, 12, 16], [7, 11, 14]],
        wave: 'square',
      }),
    });

    const trackSelect = document.getElementById('track');
    const trackInfo = document.getElementById('track-info');
    const timer = document.getElementById('timer');
    const limit = document.getElementById('limit');
    const statusBox = document.getElementById('status');
    const previewButton = document.getElementById('preview');
    const recordButton = document.getElementById('record');
    const stopButton = document.getElementById('stop');
    const playButton = document.getElementById('play');
    const deleteButton = document.getElementById('delete');

    for (const [name, element] of Object.entries({
      trackSelect,
      trackInfo,
      timer,
      limit,
      statusBox,
      previewButton,
      recordButton,
      stopButton,
      playButton,
      deleteButton,
    })) {
      if (!(element instanceof HTMLElement)) {
        throw new Error(`Required element is missing: ${name}`);
      }
    }

    let audioContext = null;
    let bgmNodes = [];
    let bgmSchedulerId = null;
    let mediaStream = null;
    let recorder = null;
    let recordedBlob = null;
    let recordedBuffer = null;
    let recordedMimeType = null;
    let voiceSource = null;
    let timerId = null;
    let startedAt = 0;
    let recordingBgmOffsetSeconds = 0;
    let fatalPlaybackError = null;

    function fail(error) {
      console.error(error);
      fatalPlaybackError = error;
      stopEverything();
      const message = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
      statusBox.className = 'status error';
      statusBox.textContent = `エラー: ${message}`;
      setMode('error');
    }

    function setStatus(message) {
      statusBox.className = 'status';
      statusBox.textContent = message;
    }

    function requireRecordedMimeType(chunks) {
      if (!recorder) throw new Error('録音処理が初期化されていません。');
      const recorderType = typeof recorder.mimeType === 'string' ? recorder.mimeType.trim() : '';
      const chunkTypes = [...new Set(
        chunks
          .map((chunk) => (typeof chunk.type === 'string' ? chunk.type.trim() : ''))
          .filter((type) => type.length > 0),
      )];
      if (chunkTypes.length > 1) {
        throw new Error(`録音データの形式が途中で変わりました: ${chunkTypes.join(', ')}`);
      }
      const chunkType = chunkTypes[0] || '';
      if (recorderType && chunkType && recorderType.toLowerCase() !== chunkType.toLowerCase()) {
        throw new Error(`MediaRecorderと録音データの形式が一致しません: recorder=${recorderType}, chunk=${chunkType}`);
      }
      const mimeType = recorderType || chunkType;
      if (!mimeType) {
        throw new Error('録音データのMIME typeを特定できませんでした。');
      }
      return mimeType;
    }

    function playbackDiagnostics() {
      return [
        `mime=${recordedMimeType || 'unknown'}`,
        `blobBytes=${recordedBlob ? recordedBlob.size : 0}`,
        `decoded=${recordedBuffer ? 'yes' : 'no'}`,
        `duration=${recordedBuffer ? recordedBuffer.duration.toFixed(3) : 'unknown'}`,
        `audioContext=${audioContext ? audioContext.state : 'missing'}`,
      ].join(', ');
    }

    function playbackFailure(stage, error) {
      const original = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
      return new Error(`${stage}に失敗しました。${playbackDiagnostics()} / 元のエラー: ${original}`);
    }

    async function decodeRecordedBlob(blob) {
      if (!(blob instanceof Blob)) throw new TypeError('録音データがBlobではありません。');
      if (blob.size <= 0) throw new Error('録音データが空です。');

      const context = await ensureAudioContext();
      const encoded = await blob.arrayBuffer();
      if (encoded.byteLength <= 0) throw new Error('録音データをArrayBufferとして読み出せませんでした。');

      try {
        const decoded = await context.decodeAudioData(encoded);
        if (!Number.isFinite(decoded.duration) || decoded.duration <= 0) {
          throw new Error(`デコード後の録音時間が不正です: ${decoded.duration}`);
        }
        return decoded;
      } catch (error) {
        const original = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
        throw new Error(`録音データのデコードに失敗しました。mime=${recordedMimeType || 'unknown'}, bytes=${blob.size} / 元のエラー: ${original}`);
      }
    }

    function requireCapabilities() {
      if (!window.AudioContext && !window.webkitAudioContext) throw new Error('この端末ではBGM再生機能を使えません。');
      if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') throw new Error('この端末ではマイク録音機能を使えません。');
      if (typeof window.MediaRecorder !== 'function') throw new Error('この端末では録音形式に対応していません。');
    }

    function currentTrack() {
      const track = TRACKS[trackSelect.value];
      if (!track) throw new Error(`Unknown track: ${trackSelect.value}`);
      return track;
    }

    function setMode(next) {
      const busy = next === 'preview' || next === 'recording' || next === 'processing' || next === 'playback';
      trackSelect.disabled = busy || !!recordedBlob || next === 'error';
      previewButton.disabled = busy || next === 'error';
      recordButton.disabled = busy || next === 'error';
      stopButton.disabled = !busy;
      playButton.disabled = busy || !recordedBlob || next === 'error';
      deleteButton.disabled = busy || !recordedBlob || next === 'error';
    }

    function formatTime(seconds) {
      const value = Math.max(0, Math.floor(seconds));
      return `${String(Math.floor(value / 60)).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
    }

    function beginTimer(onLimit, limitSeconds, audioStart) {
      if (!audioContext || !Number.isFinite(audioStart) || !Number.isFinite(limitSeconds) || limitSeconds <= 0) {
        throw new Error(`Invalid timer: start=${audioStart}, limit=${limitSeconds}`);
      }
      if (timerId !== null) clearInterval(timerId);
      // Keep the recording limit on a wall clock even if the audio device suspends.
      startedAt = performance.now() + (audioStart - audioContext.currentTime) * 1000;
      timerId = setInterval(() => {
        if (fatalPlaybackError) return;
        const elapsed = (performance.now() - startedAt) / 1000;
        timer.textContent = formatTime(Math.min(elapsed, limitSeconds));
        if (elapsed >= limitSeconds) {
          clearInterval(timerId);
          timerId = null;
          onLimit();
        }
      }, 200);
    }

    function stopTimer() {
      if (timerId !== null) clearInterval(timerId);
      timerId = null;
    }

    function midiToHz(note) {
      return 440 * Math.pow(2, (note - 69) / 12);
    }

    // Both the count-in duration and pulse spacing use quarter-note beats.
    function scoreCountInPulseBeats(track) {
      const pulse = track.countInPulseBeats === undefined ? 1 : track.countInPulseBeats;
      if (!Number.isFinite(pulse) || pulse <= 0 ||
          !Number.isInteger(track.leadInBeats / pulse)) {
        throw new Error(`Invalid score count-in pulse: leadIn=${track.leadInBeats}, pulse=${pulse}`);
      }
      return pulse;
    }

    function scoreBeats(track) {
      if (!Number.isFinite(track.bpm) || track.bpm <= 0 ||
          !Number.isFinite(track.leadInBeats) || track.leadInBeats < 0) {
        throw new Error(`Invalid score tempo/count-in: bpm=${track.bpm}, leadIn=${track.leadInBeats}`);
      }
      scoreCountInPulseBeats(track);
      function sumEvents(events, harmony) {
        if (!Array.isArray(events) || events.length === 0) throw new Error('Score events must not be empty.');
        return events.reduce((total, event, index) => {
          if (!Array.isArray(event) || event.length !== 2) throw new Error(`Invalid score event at ${index}.`);
          const [value, beats] = event;
          const notes = harmony ? value : [value];
          if ((value !== null && (!Array.isArray(notes) || notes.length === 0 ||
              notes.some((note) => !Number.isInteger(note) || note < 0 || note > 127))) ||
              !Number.isFinite(beats) || beats <= 0) {
            throw new Error(`Invalid ${harmony ? 'harmony' : 'melody'} event at ${index}: notes=${String(value)}, beats=${beats}`);
          }
          return total + beats;
        }, 0);
      }
      const melodyBeats = sumEvents(track.melody, false);
      const harmonyBeats = sumEvents(track.harmony, true);
      if (melodyBeats !== harmonyBeats) {
        throw new Error(`Score lengths differ: melody=${melodyBeats}, harmony=${harmonyBeats}`);
      }
      return melodyBeats;
    }

    function trackDurationSeconds(track = currentTrack()) {
      if (track.kind === 'loop') return MAX_SECONDS;
      if (track.kind !== 'score') throw new Error(`Unknown track kind: ${track.kind}`);
      const duration = (track.leadInBeats + scoreBeats(track)) * 60 / track.bpm + 0.15;
      if (!Number.isFinite(duration) || duration > MAX_SECONDS) {
        throw new Error(`Score exceeds recording limit: duration=${duration}, limit=${MAX_SECONDS}`);
      }
      return duration;
    }

    function updateTrackInfo() {
      const track = currentTrack();
      const duration = trackDurationSeconds(track);
      trackInfo.textContent = `${track.description}  ${track.bpm} BPM`;
      limit.textContent = track.kind === 'score' ? `曲の長さ ${formatTime(Math.ceil(duration))}` : '最大 01:00';
    }

    async function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContextClass();
      }
      if (audioContext.state === 'suspended') await audioContext.resume();
      if (audioContext.state !== 'running') throw new Error(`AudioContext is ${audioContext.state}`);
      return audioContext;
    }

    function scheduleTone(context, destination, frequency, start, duration, gainValue, wave) {
      const oscillator = context.createOscillator();
      const gain = context.createGain();
      oscillator.type = wave;
      oscillator.frequency.setValueAtTime(frequency, start);
      scheduleGainEnvelope(gain.gain, start, duration, gainValue * BGM_MASTER_GAIN);
      oscillator.connect(gain).connect(destination);
      oscillator.start(start);
      oscillator.stop(start + duration + 0.03);
      bgmNodes.push(oscillator, gain);
      oscillator.addEventListener('ended', () => {
        oscillator.disconnect();
        gain.disconnect();
        bgmNodes = bgmNodes.filter((node) => node !== oscillator && node !== gain);
      });
    }

    function scheduleGainEnvelope(gain, start, duration, peak) {
      if (!Number.isFinite(start) || !Number.isFinite(duration) || duration <= 0 ||
          !Number.isFinite(peak) || peak <= TONE_FLOOR_GAIN) {
        throw new Error(`Invalid gain envelope: start=${start}, duration=${duration}, peak=${peak}`);
      }
      const attack = Math.min(TONE_ATTACK_SECONDS, duration / 4);
      const release = Math.min(TONE_RELEASE_SECONDS, duration / 3);
      const releaseStart = Math.max(start + attack, start + duration - release);
      gain.setValueAtTime(TONE_FLOOR_GAIN, start);
      gain.exponentialRampToValueAtTime(peak, start + attack);
      gain.exponentialRampToValueAtTime(peak * TONE_SUSTAIN_RATIO, releaseStart);
      gain.exponentialRampToValueAtTime(TONE_FLOOR_GAIN, start + duration);
    }

    function createBgmOutput(context) {
      const master = context.createGain();
      const compressor = context.createDynamicsCompressor();
      master.gain.setValueAtTime(BGM_OUTPUT_GAIN, context.currentTime);
      compressor.threshold.setValueAtTime(-12, context.currentTime);
      compressor.knee.setValueAtTime(18, context.currentTime);
      compressor.ratio.setValueAtTime(4, context.currentTime);
      compressor.attack.setValueAtTime(0.003, context.currentTime);
      compressor.release.setValueAtTime(0.18, context.currentTime);
      master.connect(compressor).connect(context.destination);
      bgmNodes.push(master, compressor);
      return master;
    }

    function scoreToneEvents(track) {
      const pulse = scoreCountInPulseBeats(track);
      const events = [];
      for (let count = 0; count < track.leadInBeats / pulse; count += 1) {
        events.push({ lane: 'cue', kind: 'cue', note: 79, offsetBeats: count * pulse,
          fixedDurationSeconds: 0.09, gainValue: 0.018, wave: 'sine' });
      }

      let melodyBeat = track.leadInBeats;
      for (const [note, beats] of track.melody) {
        if (note !== null) {
          events.push({ lane: 'melody', kind: 'melody', note, offsetBeats: melodyBeat,
            durationBeats: beats, durationFactor: 0.96, gainValue: 0.055, wave: 'triangle' });
        }
        melodyBeat += beats;
      }

      let harmonyBeat = track.leadInBeats;
      for (const [notes, beats] of track.harmony) {
        if (notes !== null) {
          for (const [voice, note] of notes.entries()) {
            events.push({ lane: `harmony-${voice}`, kind: 'harmony', note, offsetBeats: harmonyBeat,
              durationBeats: beats, durationFactor: 0.98, gainValue: 0.009, wave: 'sine' });
          }
        }
        harmonyBeat += beats;
      }
      return events;
    }

    function bgmToneEvents(track) {
      if (track.kind === 'score') return scoreToneEvents(track);
      if (track.kind !== 'loop') throw new Error(`Unsupported BGM track kind: ${track.kind}`);
      const events = [];
      const beat = 60 / track.bpm;
      const totalBeats = Math.ceil(MAX_SECONDS / beat) + 4;
      for (let beatIndex = 0; beatIndex < totalBeats; beatIndex += 1) {
        const chord = track.chords[Math.floor(beatIndex / 4) % track.chords.length];
        if (beatIndex % 4 === 0) {
          for (const offset of chord) {
            events.push({ offsetBeats: beatIndex, note: track.root + offset,
              durationBeats: 3.8, durationFactor: 1, gainValue: 0.035, wave: track.wave });
          }
        }
        events.push({ offsetBeats: beatIndex, note: track.root - 12 + chord[0],
          durationBeats: 0.8, durationFactor: 1, gainValue: 0.045, wave: 'sine' });
        if (beatIndex % 2 === 0) {
          events.push({ offsetBeats: beatIndex, note: 84,
            fixedDurationSeconds: 0.035, gainValue: 0.018, wave: 'square' });
        }
      }
      return events;
    }

    async function startBgm(scheduledStart = null) {
      const context = await ensureAudioContext();
      const track = currentTrack();
      trackDurationSeconds(track);
      const beat = 60 / track.bpm;
      const start = scheduledStart === null ? context.currentTime + 0.05 : scheduledStart;
      if (!Number.isFinite(start) || start < context.currentTime) {
        throw new Error(`BGM start time is invalid: start=${start}, current=${context.currentTime}`);
      }
      // Keep the same notes and envelopes, but create only near-future nodes.
      const events = bgmToneEvents(track).sort((x, y) => x.offsetBeats - y.offsetBeats);
      stopBgm();
      const destination = createBgmOutput(context);
      let cursor = 0;
      let lastAudioTime = context.currentTime;
      let lastAudioAdvanceWall = performance.now();
      const scheduleAhead = () => {
        if (context.state !== 'running') {
          throw new Error(`BGM AudioContext became ${context.state} during playback.`);
        }
        const audioTime = context.currentTime;
        const wallTime = performance.now();
        if (audioTime > lastAudioTime + 0.001) {
          lastAudioTime = audioTime;
          lastAudioAdvanceWall = wallTime;
        } else if (wallTime - lastAudioAdvanceWall > AUDIO_CLOCK_STALL_MS) {
          throw new Error(`BGM audio clock stopped advancing: state=${context.state}, current=${audioTime.toFixed(3)}, wallElapsedMs=${Math.round(wallTime - lastAudioAdvanceWall)}`);
        }
        const horizon = audioTime + BGM_LOOKAHEAD_SECONDS;
        while (cursor < events.length) {
          const event = events[cursor];
          const when = start + event.offsetBeats * beat;
          if (when > horizon) break;
          const duration = event.fixedDurationSeconds ??
            event.durationBeats * beat * (event.durationFactor ?? 1);
          scheduleTone(context, destination, midiToHz(event.note),
            when, duration, event.gainValue, event.wave);
          cursor += 1;
        }
        if (cursor === events.length && bgmSchedulerId !== null) {
          clearInterval(bgmSchedulerId);
          bgmSchedulerId = null;
        }
      };
      scheduleAhead();
      if (cursor < events.length) {
        bgmSchedulerId = setInterval(() => {
          try { scheduleAhead(); } catch (error) { fail(error); }
        }, BGM_SCHEDULER_INTERVAL_MS);
      }
      return start;
    }

    async function openMicrophone() {
      try {
        return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (error) {
        if (!(error instanceof Error)) throw error;
        if (error.name === 'NotReadableError' || error.message.includes('Could not start audio source')) {
          throw new Error(`マイクを開始できませんでした。ほかのアプリがマイクを使用中でないか、端末のマイク設定を確認してください。元のエラー: ${error.name}: ${error.message}`);
        }
        throw error;
      }
    }

    function stopBgm() {
      if (bgmSchedulerId !== null) clearInterval(bgmSchedulerId);
      bgmSchedulerId = null;
      for (const node of bgmNodes) {
        try { if (typeof node.stop === 'function') node.stop(); } catch (_) {}
        try { node.disconnect(); } catch (_) {}
      }
      bgmNodes = [];
    }

    function stopStream() {
      if (!mediaStream) return;
      for (const track of mediaStream.getTracks()) track.stop();
      mediaStream = null;
    }

    function stopEverything() {
      stopTimer();
      stopBgm();
      if (voiceSource) {
        const source = voiceSource;
        voiceSource = null;
        try { source.stop(); } catch (_) {}
        try { source.disconnect(); } catch (_) {}
      }
      if (recorder && recorder.state === 'recording') recorder.stop();
      stopStream();
    }

    async function previewBgm() {
      try {
        requireCapabilities();
        setMode('preview');
        timer.textContent = '00:00';
        const start = await startBgm();
        beginTimer(stopByUser, trackDurationSeconds(), start);
        setStatus('BGMを再生中です。');
      } catch (error) { fail(error); }
    }

    async function startRecording() {
      try {
        requireCapabilities();
        if (recordedBlob) throw new Error('録音済みです。「とりなおす」を押してから録音してください。');
        trackDurationSeconds();
        const context = await ensureAudioContext();
        mediaStream = await openMicrophone();
        const chunks = [];
        recorder = new MediaRecorder(mediaStream);
        recorder.addEventListener('dataavailable', (event) => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        });
        recorder.addEventListener('stop', async () => {
          // A fatal WebAudio failure may stop MediaRecorder too. Never replace
          // the original error with a misleading "recording complete" message.
          if (fatalPlaybackError) return;
          try {
            if (chunks.length === 0) throw new Error('録音データが空でした。');
            recordedMimeType = requireRecordedMimeType(chunks);
            recordedBlob = new Blob(chunks, { type: recordedMimeType });
            if (!recordedBlob.type) throw new Error('録音BlobのMIME typeが空です。');
            if (recordedBlob.type.toLowerCase() !== recordedMimeType.toLowerCase()) {
              throw new Error(`録音Blobの形式が変化しました: expected=${recordedMimeType}, actual=${recordedBlob.type}`);
            }
            stopStream();
            recordedBuffer = await decodeRecordedBlob(recordedBlob);
            if (fatalPlaybackError) return;
            setMode('idle');
            setStatus(`録音できたよ！形式: ${recordedMimeType} / ${recordedBlob.size} bytes / ${recordedBuffer.duration.toFixed(1)}秒。「BGM＋うた」で聞いてみよう。曲を変えるときは「とりなおす」を押してね。`);
          } catch (error) {
            fail(error);
          }
        }, { once: true });
        const recordingStart = context.currentTime;
        recorder.start();
        setMode('recording');
        timer.textContent = '00:00';
        const bgmStart = await startBgm();
        recordingBgmOffsetSeconds = bgmStart - recordingStart;
        beginTimer(stopByUser, trackDurationSeconds() + recordingBgmOffsetSeconds, recordingStart);
        setStatus('🔴 ろくおん中… うたってね！');
      } catch (error) { fail(error); }
    }

    async function playRecording() {
      try {
        if (!recordedBlob || !recordedBuffer || !recordedMimeType) {
          throw new Error('再生可能な録音データがありません。');
        }
        if (voiceSource) throw new Error('録音音声はすでに再生中です。');

        const context = await ensureAudioContext();
        const source = context.createBufferSource();
        source.buffer = recordedBuffer;
        source.connect(context.destination);
        const startAt = context.currentTime + 0.20;

        setMode('playback');
        timer.textContent = '00:00';
        voiceSource = source;
        source.addEventListener('ended', () => {
          if (voiceSource !== source) return;
          voiceSource = null;
          stopByUser();
        }, { once: true });

        try {
          await startBgm(startAt + recordingBgmOffsetSeconds);
        } catch (error) {
          throw playbackFailure('BGMの再生', error);
        }
        try {
          source.start(startAt);
        } catch (error) {
          throw playbackFailure('録音音声の再生', error);
        }

        beginTimer(stopByUser, recordedBuffer.duration, startAt);
        setStatus(`BGMといっしょに再生中です。形式: ${recordedMimeType}`);
      } catch (error) { fail(error); }
    }

    function stopByUser() {
      if (fatalPlaybackError) return;
      const wasRecording = recorder && recorder.state === 'recording';
      stopTimer();
      stopBgm();
      if (voiceSource) {
        const source = voiceSource;
        voiceSource = null;
        try { source.stop(); } catch (_) {}
        try { source.disconnect(); } catch (_) {}
      }
      if (wasRecording) {
        recorder.stop();
        setMode('processing');
        setStatus('録音を保存しています…');
        return;
      }
      stopStream();
      setMode('idle');
      setStatus(recordedBlob ? 'もう一度聞くか、とりなおせるよ。' : '準備できたよ。');
    }

    function deleteRecording() {
      if (!recordedBlob) throw new Error('削除する録音がありません。');
      stopEverything();
      recordedBlob = null;
      recordedBuffer = null;
      recordedMimeType = null;
      recordingBgmOffsetSeconds = 0;
      recorder = null;
      timer.textContent = '00:00';
      setMode('idle');
      setStatus('録音を消しました。もう一度うたえるよ。');
    }

    trackSelect.addEventListener('change', () => {
      try { updateTrackInfo(); } catch (error) { fail(error); }
    });
    previewButton.addEventListener('click', previewBgm);
    recordButton.addEventListener('click', startRecording);
    stopButton.addEventListener('click', stopByUser);
    playButton.addEventListener('click', playRecording);
    deleteButton.addEventListener('click', () => {
      try { deleteRecording(); } catch (error) { fail(error); }
    });
    window.addEventListener('pagehide', stopEverything);

    try {
      requireCapabilities();
      updateTrackInfo();
      setMode('idle');
    } catch (error) {
      fail(error);
    }
  </script>
</body>
</html>
