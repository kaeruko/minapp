name: minapp_mobile
description: みんアプ Android client
publish_to: "none"
version: 0.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  flutter_svg: 2.0.10+1
  shared_preferences: ">=2.5.3 <3.0.0"
  url_launcher: 6.3.1
  webview_flutter: ">=4.8.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/builtin/shiba_donguri/index.html
    - assets/builtin/shiba_goshujin/index.html
    - assets/builtin/shopping_town/index.html
    - assets/builtin/shopping_town/rules.js
    - assets/builtin/ol_home/index.html
    - assets/builtin/ol_home/effects.js
    - assets/builtin/novel_starter/index.html
    - assets/builtin/novel_starter/face.jpg
    - assets/girls/mascot_pair.svg
    - assets/girls/mascot_white.svg
    - assets/girls/mascot_black.svg
