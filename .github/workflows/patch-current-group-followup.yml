name: Patch Current Group Followup

on:
  push:
    branches:
      - fix/girls-current-group-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish current group routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one match for follow-up patch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'apps/mobile/lib/girls/girls_groups_page.dart'
          replace_once(
              path,
              """    setState(() => _error = null);\n    final Uri portalUri = Uri.parse(_girlsUploadPortalUrl);\n    try {\n""",
              """    final String? selectedGroupId = _selectedGroupId;\n    if (selectedGroupId == null) {\n      setState(() => _error = '先に、いま使うグループを選んでね。');\n      return;\n    }\n    if (!groups.any((HostedGroup group) => group.groupId == selectedGroupId)) {\n      setState(() => _error = '選んでいたグループに参加していません。別のグループを選んでね。');\n      return;\n    }\n\n    setState(() => _error = null);\n    final Uri portalUri = Uri.parse(_girlsUploadPortalUrl).replace(\n      queryParameters: <String, String>{'group_id': selectedGroupId},\n    );\n    try {\n""",
          )

          path = 'apps/mobile/lib/girls/girls_home_page.dart'
          replace_once(
              path,
              """                    _LatestGroupCard(\n                      group: groups?.firstOrNull,\n                      onTap: groups == null || groups.isEmpty\n                          ? _openGroups\n                          : () => _openGroup(groups.first),\n                    ),\n""",
              """                    _LatestGroupCard(\n                      group: _currentGroup,\n                      onTap: _currentGroup == null\n                          ? _openGroups\n                          : () => _openGroup(_currentGroup!),\n                    ),\n""",
          )

          path = 'apps/web/girls_portal.js'
          replace_once(
              path,
              """  const requestedGroupId = new URL(globalThis.location.href).searchParams.get(\"group_id\");\n""",
              """  const requestedGroupId = globalThis.location === undefined\n    ? null\n    : new URL(globalThis.location.href).searchParams.get(\"group_id\");\n""",
          )

          Path('.github/workflows/patch-current-group-followup.yml').unlink()
          PY
      - name: Commit follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Route Girls actions through current group"
          git push origin HEAD:fix/girls-current-group-context
