name: Issue 172 apply ownership authorization

on:
  push:
    branches:
      - chatgpt/issue-172-hosted-app-ownership-auth
    paths:
      - .github/workflows/issue172-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/issue-172-hosted-app-ownership-auth
      - name: Apply fail-fast authorization rewrite
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue172_apply.py
          python -m compileall -q backend/src backend/tests
          python -m unittest discover -s backend/tests -p 'test_hosted_legal_backend.py'
          rm .github/issue172_apply.py .github/workflows/issue172-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#172 unify Hosted app ownership authorization"
          git push origin HEAD:chatgpt/issue-172-hosted-app-ownership-auth
