name: Patch Girls Current Group Context

on:
  push:
    branches:
      - fix/girls-current-group-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply current group context changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Shell owns the current group for the authenticated Girls session.
          path = 'apps/mobile/lib/girls/girls_home_shop_shell.dart'
          replace_once(path,
          """  GirlsFooterTab _selectedTab = GirlsFooterTab.home;\n\n  Route<void> _rootRoute(GirlsFooterTab tab) {\n""",
          """  GirlsFooterTab _selectedTab = GirlsFooterTab.home;\n  HostedGroup? _currentGroup;\n\n  void _setCurrentGroup(HostedGroup? group) {\n    if (_currentGroup?.groupId == group?.groupId) return;\n    setState(() => _currentGroup = group);\n  }\n\n  Route<void> _rootRoute(GirlsFooterTab tab) {\n""")
          replace_once(path,
          """          GirlsFooterTab.home => GirlsHomePage(\n              api: widget.api,\n              session: widget.session,\n              onLogout: widget.onLogout,\n            ),\n""",
          """          GirlsFooterTab.home => GirlsHomePage(\n              api: widget.api,\n              session: widget.session,\n              onLogout: widget.onLogout,\n              currentGroup: _currentGroup,\n              onCurrentGroupChanged: _setCurrentGroup,\n            ),\n""")
          replace_once(path,
          """          GirlsFooterTab.groups => GirlsGroupsPage(\n              api: widget.api,\n              session: widget.session,\n              onLogout: widget.onLogout,\n              onHome: () => _selectTab(GirlsFooterTab.home),\n            ),\n""",
          """          GirlsFooterTab.groups => GirlsGroupsPage(\n              api: widget.api,\n              session: widget.session,\n              onLogout: widget.onLogout,\n              onHome: () => _selectTab(GirlsFooterTab.home),\n              selectedGroupId: _currentGroup?.groupId,\n              onGroupSelected: _setCurrentGroup,\n            ),\n""")
          replace_once(path,
          """          GirlsFooterTab.apps => GirlsAppsPage(\n              api: widget.api,\n              session: widget.session,\n              onHome: () => _selectTab(GirlsFooterTab.home),\n              onGroups: () => _selectTab(GirlsFooterTab.groups),\n            ),\n""",
          """          GirlsFooterTab.apps => GirlsAppsPage(\n              api: widget.api,\n              session: widget.session,\n              onHome: () => _selectTab(GirlsFooterTab.home),\n              onGroups: () => _selectTab(GirlsFooterTab.groups),\n              currentGroup: _currentGroup,\n              onCurrentGroupChanged: _setCurrentGroup,\n            ),\n""")
          replace_once(path,
          """          GirlsFooterTab.more => GirlsAppsPage(\n              api: widget.api,\n              session: widget.session,\n              onHome: () => _selectTab(GirlsFooterTab.home),\n              onGroups: () => _selectTab(GirlsFooterTab.groups),\n            ),\n""",
          """          GirlsFooterTab.more => GirlsAppsPage(\n              api: widget.api,\n              session: widget.session,\n              onHome: () => _selectTab(GirlsFooterTab.home),\n              onGroups: () => _selectTab(GirlsFooterTab.groups),\n              currentGroup: _currentGroup,\n              onCurrentGroupChanged: _setCurrentGroup,\n            ),\n""")

          # Home keeps the shell selection in sync even when users enter Groups from a home card.
          path = 'apps/mobile/lib/girls/girls_home_page.dart'
          replace_once(path,
          """    required this.onLogout,\n    super.key,\n  });\n\n  final HostedGirlsApi api;\n  final AuthenticatedSession session;\n  final VoidCallback onLogout;\n""",
          """    required this.onLogout,\n    this.currentGroup,\n    this.onCurrentGroupChanged,\n    super.key,\n  });\n\n  final HostedGirlsApi api;\n  final AuthenticatedSession session;\n  final VoidCallback onLogout;\n  final HostedGroup? currentGroup;\n  final ValueChanged<HostedGroup?>? onCurrentGroupChanged;\n""")
          replace_once(path,
          """class _GirlsHomePageState extends State<GirlsHomePage> {\n  List<HostedGroup>? _groups;\n  bool _loadingGroups = false;\n""",
          """class _GirlsHomePageState extends State<GirlsHomePage> {\n  List<HostedGroup>? _groups;\n  HostedGroup? _currentGroup;\n  bool _loadingGroups = false;\n""")
          replace_once(path,
          """  void initState() {\n    super.initState();\n    _loadGroups();\n  }\n\n  Future<void> _loadGroups() async {\n""",
          """  void initState() {\n    super.initState();\n    _currentGroup = widget.currentGroup;\n    _loadGroups();\n  }\n\n  @override\n  void didUpdateWidget(covariant GirlsHomePage oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (widget.currentGroup?.groupId != oldWidget.currentGroup?.groupId) {\n      _currentGroup = widget.currentGroup;\n    }\n  }\n\n  void _setCurrentGroup(HostedGroup? group) {\n    if (_currentGroup?.groupId == group?.groupId) return;\n    setState(() => _currentGroup = group);\n    widget.onCurrentGroupChanged?.call(group);\n  }\n\n  Future<void> _loadGroups() async {\n""")
          replace_once(path,
          """      final List<HostedGroup> groups = await widget.api.listGroups(\n        widget.session.accessToken,\n      );\n      if (mounted) setState(() => _groups = groups);\n""",
          """      final List<HostedGroup> groups = await widget.api.listGroups(\n        widget.session.accessToken,\n      );\n      if (!mounted) return;\n      final String? previousId = _currentGroup?.groupId;\n      HostedGroup? currentGroup;\n      if (previousId != null) {\n        for (final HostedGroup group in groups) {\n          if (group.groupId == previousId) {\n            currentGroup = group;\n            break;\n          }\n        }\n      }\n      currentGroup ??= groups.length == 1 ? groups.single : null;\n      setState(() {\n        _groups = groups;\n        _currentGroup = currentGroup;\n      });\n      if (previousId != currentGroup?.groupId) {\n        widget.onCurrentGroupChanged?.call(currentGroup);\n      }\n""")
          replace_once(path,
          """        builder: (BuildContext routeContext) => GirlsGroupsPage(\n          api: widget.api,\n          session: widget.session,\n          onHome: () => Navigator.of(routeContext).pop(),\n          onLogout: () {\n""",
          """        builder: (BuildContext routeContext) => GirlsGroupsPage(\n          api: widget.api,\n          session: widget.session,\n          onHome: () => Navigator.of(routeContext).pop(),\n          selectedGroupId: _currentGroup?.groupId,\n          onGroupSelected: _setCurrentGroup,\n          onLogout: () {\n""")
          replace_once(path,
          """        builder: (BuildContext routeContext) => GirlsAppsPage(\n          api: widget.api,\n          session: widget.session,\n          onHome: () => Navigator.of(routeContext).pop(),\n        ),\n""",
          """        builder: (BuildContext routeContext) => GirlsAppsPage(\n          api: widget.api,\n          session: widget.session,\n          onHome: () => Navigator.of(routeContext).pop(),\n          onGroups: _openGroups,\n          currentGroup: _currentGroup,\n          onCurrentGroupChanged: _setCurrentGroup,\n        ),\n""")
          replace_once(path,
          """  Future<void> _openGroup(HostedGroup group) async {\n    await Navigator.of(context).push<void>(\n""",
          """  Future<void> _openGroup(HostedGroup group) async {\n    _setCurrentGroup(group);\n    await Navigator.of(context).push<void>(\n""")

          # Groups page owns the explicit user selection and highlights it.
          path = 'apps/mobile/lib/girls/girls_groups_page.dart'
          replace_once(path,
          """    required this.onLogout,\n    this.onHome,\n    super.key,\n  });\n\n  final HostedGirlsApi api;\n  final AuthenticatedSession session;\n  final VoidCallback onLogout;\n  final VoidCallback? onHome;\n""",
          """    required this.onLogout,\n    this.onHome,\n    this.selectedGroupId,\n    this.onGroupSelected,\n    super.key,\n  });\n\n  final HostedGirlsApi api;\n  final AuthenticatedSession session;\n  final VoidCallback onLogout;\n  final VoidCallback? onHome;\n  final String? selectedGroupId;\n  final ValueChanged<HostedGroup?>? onGroupSelected;\n""")
          replace_once(path,
          """class _GirlsGroupsPageState extends State<GirlsGroupsPage> {\n  List<HostedGroup>? _groups;\n  bool _busy = false;\n""",
          """class _GirlsGroupsPageState extends State<GirlsGroupsPage> {\n  List<HostedGroup>? _groups;\n  String? _selectedGroupId;\n  bool _busy = false;\n""")
          replace_once(path,
          """  void initState() {\n    super.initState();\n    _loadGroups();\n  }\n\n  Future<void> _loadGroups() async {\n""",
          """  void initState() {\n    super.initState();\n    _selectedGroupId = widget.selectedGroupId;\n    _loadGroups();\n  }\n\n  @override\n  void didUpdateWidget(covariant GirlsGroupsPage oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (widget.selectedGroupId != oldWidget.selectedGroupId) {\n      _selectedGroupId = widget.selectedGroupId;\n    }\n  }\n\n  void _selectGroup(HostedGroup? group) {\n    final String? nextId = group?.groupId;\n    if (_selectedGroupId == nextId) return;\n    setState(() => _selectedGroupId = nextId);\n    widget.onGroupSelected?.call(group);\n  }\n\n  Future<void> _loadGroups() async {\n""")
          replace_once(path,
          """      final List<HostedGroup> groups = await widget.api.listGroups(\n        widget.session.accessToken,\n      );\n      if (mounted) setState(() => _groups = groups);\n""",
          """      final List<HostedGroup> groups = await widget.api.listGroups(\n        widget.session.accessToken,\n      );\n      if (!mounted) return;\n      final String? previousId = _selectedGroupId;\n      HostedGroup? selectedGroup;\n      if (previousId != null) {\n        for (final HostedGroup group in groups) {\n          if (group.groupId == previousId) {\n            selectedGroup = group;\n            break;\n          }\n        }\n      }\n      selectedGroup ??= groups.length == 1 ? groups.single : null;\n      setState(() {\n        _groups = groups;\n        _selectedGroupId = selectedGroup?.groupId;\n      });\n      if (previousId != selectedGroup?.groupId) {\n        widget.onGroupSelected?.call(selectedGroup);\n      }\n""")
          replace_once(path,
          """  Future<void> _openGroup(HostedGroup group) async {\n    await Navigator.of(context).push<void>(\n""",
          """  Future<void> _openGroup(HostedGroup group) async {\n    _selectGroup(group);\n    await Navigator.of(context).push<void>(\n""")
          replace_once(path,
          """    if (groups.length == 1) {\n      final HostedGroup group = groups.single;\n      return _GirlsLaceFrame(\n        child: _CurrentGroupFirstView(\n          group: group,\n          onOpen: _busy ? null : () => _openGroup(group),\n        ),\n      );\n    }\n\n    return _GirlsLaceFrame(\n""",
          """    HostedGroup? selectedGroup;\n    final String? selectedId = _selectedGroupId;\n    if (selectedId != null) {\n      for (final HostedGroup group in groups) {\n        if (group.groupId == selectedId) {\n          selectedGroup = group;\n          break;\n        }\n      }\n    }\n    selectedGroup ??= groups.length == 1 ? groups.single : null;\n    if (selectedGroup != null) {\n      final HostedGroup group = selectedGroup;\n      return _GirlsLaceFrame(\n        child: _CurrentGroupFirstView(\n          group: group,\n          onOpen: _busy ? null : () => _openGroup(group),\n        ),\n      );\n    }\n\n    return _GirlsLaceFrame(\n""")
          replace_once(path,
          """                      child: _GroupTile(\n                        group: group,\n                        onTap: _busy ? null : () => _openGroup(group),\n                      ),\n""",
          """                      child: _GroupTile(\n                        group: group,\n                        isSelected: group.groupId == _selectedGroupId,\n                        onTap: _busy ? null : () => _openGroup(group),\n                      ),\n""")
          replace_once(path,
          """class _GroupTile extends StatelessWidget {\n  const _GroupTile({required this.group, required this.onTap});\n\n  final HostedGroup group;\n  final VoidCallback? onTap;\n""",
          """class _GroupTile extends StatelessWidget {\n  const _GroupTile({\n    required this.group,\n    required this.isSelected,\n    required this.onTap,\n  });\n\n  final HostedGroup group;\n  final bool isSelected;\n  final VoidCallback? onTap;\n""")
          replace_once(path,
          """    return Material(\n      color: Colors.white.withValues(alpha: .76),\n""",
          """    return Material(\n      color: isSelected\n          ? const Color(0xFFF1E8FA).withValues(alpha: .92)\n          : Colors.white.withValues(alpha: .76),\n""")
          replace_once(path,
          """                    Text(\n                      group.isOwner ? 'オーナー' : 'メンバー',\n                      style: const TextStyle(\n                        color: Color(0xFF8C7893),\n                        fontSize: 12,\n                      ),\n                    ),\n""",
          """                    Text(\n                      '${group.isOwner ? 'オーナー' : 'メンバー'}${isSelected ? ' ・ いまのグループ' : ''}',\n                      style: const TextStyle(\n                        color: Color(0xFF8C7893),\n                        fontSize: 12,\n                      ),\n                    ),\n""")
          replace_once(path,
          """              const Icon(Icons.chevron_right_rounded, color: _lavender),\n""",
          """              Icon(\n                isSelected ? Icons.check_circle_rounded : Icons.chevron_right_rounded,\n                color: _lavender,\n              ),\n""")

          # Apps page is scoped to the current group. Novel creation no longer asks again.
          path = 'apps/mobile/lib/girls/girls_apps_page.dart'
          replace_once(path,
          """    this.onHome,\n    this.onGroups,\n    super.key,\n  });\n\n  final HostedGirlsApi api;\n  final AuthenticatedSession session;\n  final VoidCallback? onHome;\n  final VoidCallback? onGroups;\n""",
          """    this.onHome,\n    this.onGroups,\n    this.currentGroup,\n    this.onCurrentGroupChanged,\n    super.key,\n  });\n\n  final HostedGirlsApi api;\n  final AuthenticatedSession session;\n  final VoidCallback? onHome;\n  final VoidCallback? onGroups;\n  final HostedGroup? currentGroup;\n  final ValueChanged<HostedGroup?>? onCurrentGroupChanged;\n""")
          replace_once(path,
          """  List<ManagedGirlsApp>? _apps;\n  List<HostedGroup>? _activeGroups;\n  bool _busy = false;\n""",
          """  List<ManagedGirlsApp>? _apps;\n  List<HostedGroup>? _activeGroups;\n  HostedGroup? _currentGroup;\n  bool _busy = false;\n""")
          replace_once(path,
          """  void initState() {\n    super.initState();\n    _managementApi = GirlsAppManagementApi(baseUri: widget.api.baseUri);\n""",
          """  void initState() {\n    super.initState();\n    _currentGroup = widget.currentGroup;\n    _managementApi = GirlsAppManagementApi(baseUri: widget.api.baseUri);\n""")
          replace_once(path,
          """  @override\n  void dispose() {\n""",
          """  @override\n  void didUpdateWidget(covariant GirlsAppsPage oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (widget.currentGroup?.groupId != oldWidget.currentGroup?.groupId) {\n      _currentGroup = widget.currentGroup;\n    }\n  }\n\n  @override\n  void dispose() {\n""")
          replace_once(path,
          """      if (!mounted) return;\n      setState(() {\n        _activeGroups = groups;\n        _apps = apps\n            .where((ManagedGirlsApp app) => !_isNovelInfrastructureApp(app))\n            .toList(growable: false);\n      });\n""",
          """      if (!mounted) return;\n      final String? previousId = _currentGroup?.groupId;\n      HostedGroup? currentGroup;\n      if (previousId != null) {\n        for (final HostedGroup group in groups) {\n          if (group.groupId == previousId) {\n            currentGroup = group;\n            break;\n          }\n        }\n      }\n      currentGroup ??= groups.length == 1 ? groups.single : null;\n      setState(() {\n        _activeGroups = groups;\n        _currentGroup = currentGroup;\n        _apps = currentGroup == null\n            ? <ManagedGirlsApp>[]\n            : apps\n                .where(\n                  (ManagedGirlsApp app) =>\n                      app.app.groupId == currentGroup!.groupId &&\n                      !_isNovelInfrastructureApp(app),\n                )\n                .toList(growable: false);\n      });\n      if (previousId != currentGroup?.groupId) {\n        widget.onCurrentGroupChanged?.call(currentGroup);\n      }\n""")
          replace_once(path,
          """    if (activeGroups.isEmpty) {\n      setState(() => _error = 'アプリを追加するには、参加中のグループが必要です。');\n      return;\n    }\n\n    setState(() => _error = null);\n    final Uri portalUri = Uri.parse(_girlsUploadPortalUrl);\n""",
          """    if (activeGroups.isEmpty) {\n      setState(() => _error = 'アプリを追加するには、参加中のグループが必要です。');\n      return;\n    }\n    final HostedGroup? group = _currentGroup;\n    if (group == null) {\n      setState(() => _error = '先に「グループ」から、いま使うグループを選んでね。');\n      return;\n    }\n\n    setState(() => _error = null);\n    final Uri portalUri = Uri.parse(_girlsUploadPortalUrl).replace(\n      queryParameters: <String, String>{'group_id': group.groupId},\n    );\n""")
          # Remove the per-action group chooser.
          text = Path(path).read_text(encoding='utf-8')
          start = text.index('  Future<HostedGroup?> _chooseActiveGroup(')
          end = text.index('  Future<void> _openNovelMaker()', start)
          text = text[:start] + text[end:]
          Path(path).write_text(text, encoding='utf-8')
          replace_once(path,
          """    if (activeGroups.isEmpty) {\n      setState(() => _error = 'ノベルゲームを作るには、参加中のグループが必要です。');\n      return;\n    }\n    final HostedGroup? group = await _chooseActiveGroup(activeGroups);\n    if (group == null || !mounted) return;\n\n    setState(() {\n""",
          """    if (activeGroups.isEmpty) {\n      setState(() => _error = 'ノベルゲームを作るには、参加中のグループが必要です。');\n      return;\n    }\n    final HostedGroup? group = _currentGroup;\n    if (group == null) {\n      setState(() => _error = '先に「グループ」から、いま使うグループを選んでね。');\n      return;\n    }\n\n    setState(() {\n""")
          replace_once(path,
          """          children: <Widget>[\n            FilledButton.icon(\n""",
          """          children: <Widget>[\n            _CurrentGroupBanner(\n              group: _currentGroup,\n              onChange: widget.onGroups,\n            ),\n            const SizedBox(height: 12),\n            FilledButton.icon(\n""")
          replace_once(path,
          """            else if (apps.isEmpty)\n              const _EmptyApps()\n            else\n""",
          """            else if (_currentGroup == null)\n              _NoCurrentGroup(onSelect: widget.onGroups)\n            else if (apps.isEmpty)\n              const _EmptyApps()\n            else\n""")
          # Add current-group UI before the managed app card class.
          marker = 'class _ManagedAppCard extends StatelessWidget {'
          text = Path(path).read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise RuntimeError('girls_apps_page.dart: managed app card marker mismatch')
          addition = r'''class _CurrentGroupBanner extends StatelessWidget {
  const _CurrentGroupBanner({required this.group, required this.onChange});

  final HostedGroup? group;
  final VoidCallback? onChange;

  @override
  Widget build(BuildContext context) {
    return Container(
      key: const Key('girls-apps-current-group'),
      padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 11),
      decoration: BoxDecoration(
        color: const Color(0xFFF1E8FA).withValues(alpha: .78),
        borderRadius: BorderRadius.circular(18),
      ),
      child: Row(
        children: <Widget>[
          const Icon(Icons.groups_rounded, color: _lavender),
          const SizedBox(width: 10),
          Expanded(
            child: Column(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: <Widget>[
                const Text(
                  'いまのグループ',
                  style: TextStyle(
                    color: Color(0xFF8F7A74),
                    fontSize: 11,
                    fontWeight: FontWeight.w800,
                  ),
                ),
                Text(
                  group?.name ?? 'まだ選んでいません',
                  style: const TextStyle(
                    color: _ink,
                    fontWeight: FontWeight.w900,
                  ),
                ),
              ],
            ),
          ),
          TextButton(
            onPressed: onChange,
            child: Text(group == null ? '選ぶ' : '変更'),
          ),
        ],
      ),
    );
  }
}

class _NoCurrentGroup extends StatelessWidget {
  const _NoCurrentGroup({required this.onSelect});

  final VoidCallback? onSelect;

  @override
  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.all(20),
      decoration: BoxDecoration(
        color: Colors.white.withValues(alpha: .72),
        borderRadius: BorderRadius.circular(20),
      ),
      child: Column(
        children: <Widget>[
          const Text(
            'グループを選ぶと、そのグループのアプリだけがここに並ぶよ。',
            textAlign: TextAlign.center,
            style: TextStyle(color: _ink, fontWeight: FontWeight.w700),
          ),
          const SizedBox(height: 10),
          OutlinedButton.icon(
            onPressed: onSelect,
            icon: const Icon(Icons.groups_rounded),
            label: const Text('グループを選ぶ'),
          ),
        ],
      ),
    );
  }
}

'''
          Path(path).write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          # The external Girls upload portal honors the current group supplied by mobile.
          path = 'apps/web/girls_portal.js'
          replace_once(path,
          """  const ID_PATTERN = /^[0-9a-f]{32}$/;\n  const LOGIN_ID_PATTERN = /^[a-z0-9][a-z0-9-]{2,31}$/;\n""",
          """  const ID_PATTERN = /^[0-9a-f]{32}$/;\n  const LOGIN_ID_PATTERN = /^[a-z0-9][a-z0-9-]{2,31}$/;\n  const requestedGroupId = new URL(globalThis.location.href).searchParams.get(\"group_id\");\n  if (requestedGroupId !== null && !ID_PATTERN.test(requestedGroupId)) {\n    throw new Error(\"Girls portal group_id query parameter is invalid.\");\n  }\n""")
          replace_once(path,
          """    uploadGroup.disabled = groups.length === 0;\n    uploadSubmit.disabled = groups.length === 0;\n    if (groups.length === 0) {\n      setMessage(uploadError, \"アプリを追加するには、参加中のグループが必要です。Girlsアプリでグループを作るか参加してください。\");\n    } else {\n      setMessage(uploadError, null);\n    }\n""",
          """    uploadGroup.disabled = groups.length === 0;\n    uploadSubmit.disabled = groups.length === 0;\n    if (groups.length === 0) {\n      setMessage(uploadError, \"アプリを追加するには、参加中のグループが必要です。Girlsアプリでグループを作るか参加してください。\");\n    } else if (requestedGroupId !== null) {\n      const requestedGroup = groups.find((group) => group.group_id === requestedGroupId);\n      if (requestedGroup === undefined) {\n        uploadGroup.value = \"\";\n        uploadSubmit.disabled = true;\n        setMessage(uploadError, \"Girlsアプリで選んだグループに参加していません。アプリに戻ってグループを選び直してください。\");\n      } else {\n        uploadGroup.value = requestedGroupId;\n        setMessage(uploadError, null);\n      }\n    } else {\n      setMessage(uploadError, null);\n    }\n""")

          # Remove this one-shot workflow from the resulting branch.
          Path('.github/workflows/patch-girls-current-group-context.yml').unlink()
          PY

          dart format \
            apps/mobile/lib/girls/girls_home_shop_shell.dart \
            apps/mobile/lib/girls/girls_home_page.dart \
            apps/mobile/lib/girls/girls_groups_page.dart \
            apps/mobile/lib/girls/girls_apps_page.dart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/mobile/lib/girls/girls_home_shop_shell.dart \
            apps/mobile/lib/girls/girls_home_page.dart \
            apps/mobile/lib/girls/girls_groups_page.dart \
            apps/mobile/lib/girls/girls_apps_page.dart \
            apps/web/girls_portal.js \
            .github/workflows/patch-girls-current-group-context.yml
          git commit -m "Use selected Girls group across app flows"
          git push origin HEAD:fix/girls-current-group-context
