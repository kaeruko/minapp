name: Patch Girls Shop Download Filename

on:
  push:
    branches:
      - fix/girls-shop-download-filename

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch shop download filename
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/hosted_shop_backend.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import zipfile\nfrom typing import Any\n'
          new_import = 'import zipfile\nfrom typing import Any\nfrom urllib.parse import quote\n'
          if old_import not in text:
              raise RuntimeError('expected import block not found')
          text = text.replace(old_import, new_import, 1)

          anchor = 'SHOP_VISIBILITIES = frozenset({"listed", "unlisted"})\n\n\nclass HostedShopBackend'
          helper = '''SHOP_VISIBILITIES = frozenset({"listed", "unlisted"})\n\n\ndef _shop_download_filename(title: str, app_id: str) -> str:\n    if not isinstance(title, str) or not title:\n        raise ValueError("shop download title must be a non-empty string")\n    if not isinstance(app_id, str) or not app_id:\n        raise ValueError("shop download app_id must be a non-empty string")\n    forbidden = '<>:"/\\\\|?*'\n    sanitized = "".join(\n        "_" if char in forbidden or ord(char) < 32 else char\n        for char in title\n    ).strip().rstrip(". ")\n    if not sanitized:\n        sanitized = f"minapp-{app_id[:8]}"\n    return f"{sanitized}.zip"\n\n\ndef _shop_download_content_disposition(filename: str, app_id: str) -> str:\n    ascii_fallback = f"minapp-{app_id}.zip"\n    encoded = quote(filename, safe="")\n    return (\n        f'attachment; filename="{ascii_fallback}"; '\n        f"filename*=UTF-8''{encoded}"\n    )\n\n\nclass HostedShopBackend'''
          if anchor not in text:
              raise RuntimeError('helper insertion anchor not found')
          text = text.replace(anchor, helper, 1)

          old = '''        key = _item_string(app, "published_key")\n        sha256 = _item_string(app, "published_sha256")\n        url = self._s3.generate_presigned_url(\n            "get_object",\n            Params={\n                "Bucket": self._published_bucket,\n                "Key": key,\n                "ResponseContentType": "application/zip",\n                "ResponseContentDisposition": f'attachment; filename="{app_id}.zip"',\n            },\n            ExpiresIn=SHOP_DOWNLOAD_TTL_SECONDS,\n        )\n        if not isinstance(url, str) or not url.startswith("https://"):\n            raise RuntimeError("S3 did not return an HTTPS presigned URL")\n        return {\n            "url": url,\n            "filename": f"{app_id}.zip",\n            "sha256": sha256,\n            "expires_in": SHOP_DOWNLOAD_TTL_SECONDS,\n        }'''
          new = '''        key = _item_string(app, "published_key")\n        sha256 = _item_string(app, "published_sha256")\n        filename = _shop_download_filename(_item_string(app, "title"), app_id)\n        content_disposition = _shop_download_content_disposition(filename, app_id)\n        url = self._s3.generate_presigned_url(\n            "get_object",\n            Params={\n                "Bucket": self._published_bucket,\n                "Key": key,\n                "ResponseContentType": "application/zip",\n                "ResponseContentDisposition": content_disposition,\n            },\n            ExpiresIn=SHOP_DOWNLOAD_TTL_SECONDS,\n        )\n        if not isinstance(url, str) or not url.startswith("https://"):\n            raise RuntimeError("S3 did not return an HTTPS presigned URL")\n        return {\n            "url": url,\n            "filename": filename,\n            "sha256": sha256,\n            "expires_in": SHOP_DOWNLOAD_TTL_SECONDS,\n        }'''
          if old not in text:
              raise RuntimeError('create_shop_download block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('backend/tests/test_hosted_shop_download_filename.py')
          test.write_text('''from __future__ import annotations\n\nimport pathlib\nimport sys\nimport unittest\n\nROOT = pathlib.Path(__file__).resolve().parents[1]\nSRC = ROOT / "src"\nif str(SRC) not in sys.path:\n    sys.path.insert(0, str(SRC))\n\nfrom hosted_shop_backend import (\n    _shop_download_content_disposition,\n    _shop_download_filename,\n)\n\n\nclass HostedShopDownloadFilenameTests(unittest.TestCase):\n    def test_keeps_japanese_title_for_user_visible_filename(self) -> None:\n        filename = _shop_download_filename("おえかき", "ecb3cb6a08e05305668a952cbdae435b")\n        self.assertEqual(filename, "おえかき.zip")\n\n        disposition = _shop_download_content_disposition(\n            filename,\n            "ecb3cb6a08e05305668a952cbdae435b",\n        )\n        self.assertIn('filename="minapp-ecb3cb6a08e05305668a952cbdae435b.zip"', disposition)\n        self.assertIn("filename*=UTF-8''%E3%81%8A%E3%81%88%E3%81%8B%E3%81%8D.zip", disposition)\n\n    def test_replaces_filesystem_unsafe_title_characters(self) -> None:\n        filename = _shop_download_filename('猫/犬:ゲーム?*"<>|', "abcdef0123456789")\n        self.assertEqual(filename, "猫_犬_ゲーム_______.zip")\n\n    def test_uses_safe_fallback_when_title_becomes_empty(self) -> None:\n        filename = _shop_download_filename('... ', "abcdef0123456789")\n        self.assertEqual(filename, "minapp-abcdef01.zip")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/hosted_shop_backend.py backend/tests/test_hosted_shop_download_filename.py
          git commit -m "Use shop titles for downloaded ZIP names"
          git push origin HEAD:fix/girls-shop-download-filename
