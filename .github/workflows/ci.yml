name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q backend/src backend/tests tools
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check JavaScript syntax
        run: node --check apps/web/app.js

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
      - name: Format
        run: terraform fmt -check -recursive infra/terraform
      - name: Init without remote backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate
        run: terraform -chdir=infra/terraform validate
