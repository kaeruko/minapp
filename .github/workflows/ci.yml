name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q backend/src backend/tests directory/src directory/tests tools
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Run Directory tests
        run: python -m unittest discover -s directory/tests -v
      - name: Run tool tests
        run: python -m unittest discover -s tools/tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/phase2.js
          node --check apps/web/phase2_transport.js
          node --check apps/web/phase2_transport.test.js
          node --check apps/web/phase4.js
          node --check apps/web/student_dashboard.js
          node --check apps/web/teacher_dashboard.js
          node --check apps/web/moderation_actions.js
          node --check apps/web/display_names.js
          node --check apps/web/portal_routing.js
          node --check apps/web/portal_routing.test.js
          node --check apps/web/portal_shell.js
          node --check apps/web/portal_shell.test.js
          node --check apps/web/single_html_zip.js
          node --check apps/web/single_html_zip.test.js
          node --check apps/web/girls_portal.js
      - name: Test Web portal behavior
        run: node --test apps/web/portal_routing.test.js apps/web/phase2_transport.test.js apps/web/portal_shell.test.js apps/web/single_html_zip.test.js

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse operator scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "PowerShell parse failed: $($_.FullName)"
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) {
            exit 1
          }

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
      - name: Format
        run: terraform fmt -check -diff -recursive infra
      - name: Init tenant stack without remote backend
        run: terraform -chdir=infra/terraform init -backend=false -input=false
      - name: Validate tenant stack
        run: terraform -chdir=infra/terraform validate
      - name: Init hosted tenant stack without remote backend
        run: terraform -chdir=infra/hosted init -backend=false -input=false
      - name: Validate hosted tenant stack
        run: terraform -chdir=infra/hosted validate
      - name: Init Directory stack without remote backend
        run: terraform -chdir=infra/directory init -backend=false -input=false
      - name: Validate Directory stack
        run: terraform -chdir=infra/directory validate
      - name: Init portal stack without remote backend
        run: terraform -chdir=infra/portal init -backend=false -input=false
      - name: Validate portal stack
        run: terraform -chdir=infra/portal validate
