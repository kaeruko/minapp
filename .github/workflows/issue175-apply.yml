name: Issue 175 apply patch

on:
  push:
    branches:
      - chatgpt/issue-175-neutral-app-zip
    paths:
      - .github/workflows/issue175-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/issue-175-neutral-app-zip
      - name: Apply exact import rewrite
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "backend/src/hosted_catalog_backend.py": [
                  (
                      "from aws_backend import _aws_error_code, _item_string, _required_env, _string_attr\n",
                      "from app_zip import (\n"
                      "    MAX_ZIP_BYTES,\n"
                      "    content_type as _content_type,\n"
                      "    safe_zip_paths as _safe_zip_paths,\n"
                      ")\n"
                      "from aws_backend import _aws_error_code, _item_string, _required_env, _string_attr\n",
                  ),
                  ("from phase2_backend import MAX_ZIP_BYTES, _content_type, _safe_zip_paths\n", ""),
              ],
              "backend/src/hosted_authoring_publish_backend.py": [
                  (
                      "from aws_backend import _aws_error_code, _item_string, _string_attr\n",
                      "from app_zip import MAX_ZIP_BYTES, safe_zip_paths as _safe_zip_paths\n"
                      "from aws_backend import _aws_error_code, _item_string, _string_attr\n",
                  ),
                  ("from phase2_backend import MAX_ZIP_BYTES, _safe_zip_paths\n", ""),
              ],
              "backend/src/hosted_app_management.py": [
                  (
                      "from aws_backend import _item_string, _string_attr\n",
                      "from app_zip import content_type as _content_type\n"
                      "from aws_backend import _item_string, _string_attr\n",
                  ),
                  ("    _content_type,\n", ""),
              ],
              "backend/src/hosted_authoring_launch.py": [
                  (
                      "from aws_backend import _item_string, _string_attr\n",
                      "from app_zip import content_type as _content_type\n"
                      "from aws_backend import _item_string, _string_attr\n",
                  ),
                  ("    _content_type,\n", ""),
              ],
              "backend/src/hosted_authoring_preview.py": [
                  (
                      "from aws_backend import _item_string, _string_attr\n",
                      "from app_zip import content_type as _content_type\n"
                      "from aws_backend import _item_string, _string_attr\n",
                  ),
                  (
                      "from hosted_catalog_backend import _content_type, _files_json, _item_files, _optional_number\n",
                      "from hosted_catalog_backend import _files_json, _item_files, _optional_number\n",
                  ),
              ],
              "backend/tests/test_phase2_backend.py": [
                  (
                      "from errors import ApiProblem  # noqa: E402\n"
                      "from phase2_backend import _content_type, _safe_zip_paths  # noqa: E402\n",
                      "from app_zip import content_type as _content_type, safe_zip_paths as _safe_zip_paths  # noqa: E402\n"
                      "from errors import ApiProblem  # noqa: E402\n",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise RuntimeError(f"{filename}: expected exactly one occurrence, found {count}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          rm .github/issue175.patch
          rm .github/workflows/issue175-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#175 finish neutral ZIP import rewrite"
          git push origin HEAD:chatgpt/issue-175-neutral-app-zip
