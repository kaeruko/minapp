name: Issue 180 Authoring asset polish

on:
  push:
    branches:
      - chatgpt/issue-180-authoring-assets
    paths:
      - '.github/workflows/issue180-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/issue-180-authoring-assets
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Tighten response validation and formatting
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected one exact match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          native = 'apps/mobile/lib/hosted_authoring_bridge.dart'
          old_native = """    _validateProjectPayload(payload, includeDocument: false);
              if (payload['draft_revision'] != expectedRevision + 1) {
          """
          new_native = """    _validateProjectPayload(payload, includeDocument: false);
              if (payload['status'] != 'draft') {
                throw const FormatException(
                  'Authoring asset mutation response must remain draft.',
                );
              }
              if (payload['draft_revision'] != expectedRevision + 1) {
          """
          # Same invariant applies to both saveAsset and deleteAsset.
          p = Path(native)
          text = p.read_text()
          if text.count(old_native) != 2:
              raise RuntimeError(f'{native}: expected two asset mutation anchors, found {text.count(old_native)}')
          p.write_text(text.replace(old_native, new_native, 2))

          web = 'apps/web/authoring_host_adapter.js'
          p = Path(web)
          text = p.read_text()
          start = text.index('  function validateAuthoringAssetPath(value) {')
          end = text.index('\n\n  function authoringAssetContentType(path) {', start)
          block = text[start:end]
          expected = '''  function validateAuthoringAssetPath(value) {
          if (typeof value !== "string" || value.length === 0 || value.length > 256 ||
              value.startsWith("/") || value.includes("\\\\") || value.includes("\\0")) {
            throw new Error("Authoring asset path is invalid.");
          }
          const parts = value.split("/");
          if (parts.some((part) => part === "" || part === "." || part === "..")) {
            throw new Error("Authoring asset path is invalid.");
          }
          const name = parts[parts.length - 1];
          const dot = name.lastIndexOf(".");
          const extension = dot < 0 ? "" : name.slice(dot + 1).toLowerCase();
          if (!Object.prototype.hasOwnProperty.call(AUTHORING_ASSET_CONTENT_TYPES, extension)) {
            throw new Error("Authoring asset type is not supported.");
          }
          return value;
        }'''
          # Compare normalized text exactly before touching style.
          if block != expected:
              raise RuntimeError('Web asset path helper changed unexpectedly')
          polished = '''  function validateAuthoringAssetPath(value) {
            if (
              typeof value !== "string" ||
              value.length === 0 ||
              value.length > 256 ||
              value.startsWith("/") ||
              value.includes("\\\\") ||
              value.includes("\\0")
            ) {
              throw new Error("Authoring asset path is invalid.");
            }
            const parts = value.split("/");
            if (parts.some((part) => part === "" || part === "." || part === "..")) {
              throw new Error("Authoring asset path is invalid.");
            }
            const name = parts[parts.length - 1];
            const dot = name.lastIndexOf(".");
            const extension = dot < 0 ? "" : name.slice(dot + 1).toLowerCase();
            if (!Object.prototype.hasOwnProperty.call(AUTHORING_ASSET_CONTENT_TYPES, extension)) {
              throw new Error("Authoring asset type is not supported.");
            }
            return value;
          }'''
          text = text[:start] + polished + text[end:]
          old_status = '''    if (!Number.isInteger(payload.draft_revision) || payload.draft_revision !== expectedRevision + 1) {
          '''
          new_status = '''    if (payload.status !== "draft") {
              throw new HostedWebApiError(
                response.status,
                "invalid_api_response",
                "Authoring asset mutation response must remain draft.",
              );
            }
            if (!Number.isInteger(payload.draft_revision) || payload.draft_revision !== expectedRevision + 1) {
          '''
          if text.count(old_status) != 1:
              raise RuntimeError(f'{web}: expected one mutation revision anchor, found {text.count(old_status)}')
          p.write_text(text.replace(old_status, new_status, 1))

          Path('.github/workflows/issue180-polish.yml').unlink()

      - name: Test Web Host Adapter
        run: node --test apps/web/authoring_host_adapter.test.js

      - name: Check Web syntax
        run: node --check apps/web/authoring_host_adapter.js

      - name: Resolve Flutter packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format and test Native bridge
        working-directory: apps/mobile
        run: |
          dart format lib/hosted_authoring_bridge.dart
          flutter test test/hosted_authoring_bridge_test.dart

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#180 tighten Authoring asset response contract"
          git push origin HEAD:chatgpt/issue-180-authoring-assets
