name: Issue 180 Authoring assets v3

on:
  push:
    branches:
      - chatgpt/issue-180-authoring-assets
    paths:
      - '.github/workflows/issue180-assets-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/issue-180-authoring-assets
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Apply reviewed v2 migration
        shell: python
        run: |
          import subprocess
          import textwrap
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              '69883183a8c1ef45a5e2ce41eb3aee5acd749d48:.github/workflows/issue180-assets-v2.yml',
          ], text=True)
          marker = "      - name: Apply generic asset bridge\n        shell: python\n        run: |\n"
          end_marker = "      - name: Test backend Web bridge\n"
          if source.count(marker) != 1 or source.count(end_marker) != 1:
              raise RuntimeError('Cannot extract reviewed v2 migration')
          script = textwrap.dedent(source.split(marker, 1)[1].split(end_marker, 1)[0])
          exec(compile(script, 'issue180-v2-migration.py', 'exec'), {'__name__': '__issue180_v2__'})
          Path('.github/workflows/issue180-assets-v3.yml').unlink()

      - name: Test backend Web bridge
        env:
          PYTHONPATH: backend/src:backend/tests
        run: python -m unittest discover -s backend/tests -p 'test_hosted_authoring_web_bridge.py' -v

      - name: Test Web Host Adapter
        run: node --test apps/web/authoring_host_adapter.test.js

      - name: Check Python and JavaScript syntax
        run: |
          python -m py_compile backend/src/hosted_authoring_web_bridge.py backend/tests/test_hosted_authoring_web_bridge.py
          node --check apps/web/authoring_host_adapter.js
          node --check apps/web/authoring_host_adapter.test.js

      - name: Resolve Flutter packages
        working-directory: apps/mobile
        run: flutter pub get

      - name: Format and test Native Authoring bridge
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib/hosted_authoring_bridge.dart test/hosted_authoring_bridge_test.dart
          flutter test test/hosted_authoring_bridge_test.dart

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#180 expose scoped Authoring asset bridge"
          git push origin HEAD:chatgpt/issue-180-authoring-assets
