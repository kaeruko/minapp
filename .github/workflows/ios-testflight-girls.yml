name: iOS Girls TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_BUNDLE_ID: ${{ vars.GIRLS_IOS_BUNDLE_ID }}
  APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.GIRLS_APP_STORE_CONNECT_API_KEY_ID }}

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          config_output="$(flutter config --list)"
          printf '%s\n' "$config_output"
          grep -Fq 'enable-swift-package-manager: true' <<< "$config_output" || {
            echo "Flutter Swift Package Manager support is not enabled after explicit configuration" >&2
            exit 1
          }

      - name: Validate Girls release configuration
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.GIRLS_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.GIRLS_APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.GIRLS_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.GIRLS_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.GIRLS_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$IOS_BUNDLE_ID" ]] || { echo "Missing repository variable: GIRLS_IOS_BUNDLE_ID" >&2; exit 1; }
          [[ "$IOS_BUNDLE_ID" == *.* ]] || { echo "GIRLS_IOS_BUNDLE_ID is not a bundle identifier: $IOS_BUNDLE_ID" >&2; exit 1; }
          [[ -n "$APP_STORE_CONNECT_API_KEY_ID" ]] || { echo "Missing secret: GIRLS_APP_STORE_CONNECT_API_KEY_ID" >&2; exit 1; }
          [[ -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" ]] || { echo "Missing secret: GIRLS_APP_STORE_CONNECT_API_KEY_P8_BASE64" >&2; exit 1; }
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] || { echo "Missing secret: GIRLS_APP_STORE_CONNECT_ISSUER_ID" >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] || { echo "Missing secret: GIRLS_IOS_DISTRIBUTION_CERTIFICATE_BASE64" >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" ]] || { echo "Missing secret: GIRLS_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" >&2; exit 1; }
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo "Missing secret: GIRLS_IOS_PROVISIONING_PROFILE_BASE64" >&2; exit 1; }
          [[ -f lib/main_girls.dart ]] || { echo "Girls entrypoint is missing: apps/mobile/lib/main_girls.dart" >&2; exit 1; }

      - name: Resolve packages and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Generate Girls iOS platform
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e ios ]] || {
            echo "apps/mobile/ios already exists. This workflow expects to generate iOS from the pinned Flutter project boundary." >&2
            exit 1
          }

          temp_project="$(mktemp -d)"
          trap 'rm -rf "$temp_project"' EXIT

          flutter create \
            --platforms=ios \
            --org jp.cloxs \
            --project-name minapp \
            "$temp_project"

          [[ -d "$temp_project/ios" ]] || {
            echo "flutter create completed without generating an iOS platform directory" >&2
            exit 1
          }

          cp -R "$temp_project/ios" ./ios

          pbxproj="ios/Runner.xcodeproj/project.pbxproj"
          [[ -f "$pbxproj" ]] || {
            echo "Generated Xcode project is missing: $pbxproj" >&2
            exit 1
          }

          python3 - "$pbxproj" "$IOS_BUNDLE_ID" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          bundle_id = sys.argv[2]
          generated_bundle_id = "jp.cloxs.minapp"
          marker = f"PRODUCT_BUNDLE_IDENTIFIER = {generated_bundle_id};"
          replacement = f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};"
          text = path.read_text(encoding="utf-8")
          count = text.count(marker)
          if count != 3:
              raise RuntimeError(
                  f"Expected exactly 3 generated Runner bundle-id entries for {generated_bundle_id}, found {count}"
              )
          patched = text.replace(marker, replacement)
          if patched.count(replacement) != 3:
              raise RuntimeError(
                  f"Expected exactly 3 Girls Runner bundle-id entries for {bundle_id} after patch"
              )
          path.write_text(patched, encoding="utf-8")
          PY

          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};" "$pbxproj" || {
            echo "Generated Xcode project does not contain Girls bundle id ${IOS_BUNDLE_ID}" >&2
            exit 1
          }

          iconset="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          python3 tool/install_ios_app_icon_girls.py "$iconset"

          info_plist="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName みんアプGirls" "$info_plist"

      - name: Validate Xcode iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          [[ -n "$sdk_path" && -d "$sdk_path" ]] || {
            echo "iPhoneOS SDK is unavailable from the selected Xcode: $sdk_path" >&2
            exit 1
          }
          echo "Using iPhoneOS SDK: $sdk_path"

      - name: Install Girls signing certificate and provisioning profile
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.GIRLS_IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.GIRLS_IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.GIRLS_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          cert_path="${RUNNER_TEMP}/girls-distribution.p12"
          profile_path="${RUNNER_TEMP}/girls-profile.mobileprovision"
          profile_plist="${RUNNER_TEMP}/girls-profile.plist"
          keychain_path="${RUNNER_TEMP}/minapp-girls-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          [[ -s "$cert_path" ]] || { echo "Decoded Girls distribution certificate is empty" >&2; exit 1; }
          [[ -s "$profile_path" ]] || { echo "Decoded Girls provisioning profile is empty" >&2; exit 1; }

          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_bundle_id="${application_identifier#*.}"

          [[ -n "$profile_uuid" && -n "$profile_name" && -n "$team_id" ]] || {
            echo "Girls provisioning profile is missing UUID, Name, or TeamIdentifier" >&2
            exit 1
          }

          [[ "$profile_bundle_id" == "$IOS_BUNDLE_ID" ]] || {
            echo "Girls provisioning profile bundle id mismatch: expected ${IOS_BUNDLE_ID}, got ${profile_bundle_id}" >&2
            exit 1
          }

          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "Girls provisioning profile contains ProvisionedDevices and is not an App Store distribution profile" >&2
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          current_keychains="$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$keychain_path" $current_keychains

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          grep -Fq 'Apple Distribution' <<< "$identities" || {
            echo "Imported Girls p12 does not expose an Apple Distribution signing identity" >&2
            exit 1
          }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          export_options="${RUNNER_TEMP}/Girls-ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${team_id}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${profile_name}</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "export_options=$export_options" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"

      - name: Build signed Girls IPA
        id: build
        shell: bash
        env:
          EXPORT_OPTIONS_PLIST: ${{ steps.signing.outputs.export_options }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --config-only \
            --no-codesign \
            --target lib/main_girls.dart \
            --build-number "$GITHUB_RUN_NUMBER"

          pbxproj="ios/Runner.xcodeproj/project.pbxproj"
          python3 - "$pbxproj" "$IOS_BUNDLE_ID" "$TEAM_ID" "$PROFILE_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          bundle_id = sys.argv[2]
          team_id = sys.argv[3]
          profile_name = sys.argv[4]
          text = path.read_text(encoding="utf-8")

          block_pattern = re.compile(r"buildSettings = \{\n(?P<body>.*?)\n\s*\};", re.DOTALL)
          matched = 0

          def patch_block(match):
              global matched
              body = match.group("body")
              bundle_marker = f"PRODUCT_BUNDLE_IDENTIFIER = {bundle_id};"
              if bundle_marker not in body:
                  return match.group(0)

              matched += 1
              body = re.sub(
                  r"^\s*(?:CODE_SIGN_STYLE|CODE_SIGN_IDENTITY|DEVELOPMENT_TEAM|PROVISIONING_PROFILE_SPECIFIER)\s*=.*;\n?",
                  "",
                  body,
                  flags=re.MULTILINE,
              )
              product_match = re.search(
                  rf"^(?P<indent>\s*)PRODUCT_BUNDLE_IDENTIFIER = {re.escape(bundle_id)};$",
                  body,
                  flags=re.MULTILINE,
              )
              if product_match is None:
                  raise RuntimeError("Girls Runner build settings block lost the expected bundle identifier")

              indent = product_match.group("indent")
              signing = (
                  f'{indent}CODE_SIGN_IDENTITY = "Apple Distribution";\n'
                  f"{indent}CODE_SIGN_STYLE = Manual;\n"
                  f"{indent}DEVELOPMENT_TEAM = {team_id};\n"
                  f'{indent}PROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n'
              )
              body = body[: product_match.start()] + signing + body[product_match.start() :]
              return "buildSettings = {\n" + body + "\n\t\t\t};"

          patched = block_pattern.sub(patch_block, text)
          if matched != 3:
              raise RuntimeError(
                  f"Expected exactly 3 Girls Runner build configuration blocks for {bundle_id}, found {matched}"
              )
          path.write_text(patched, encoding="utf-8")
          PY

          pushd ios >/dev/null

          build_settings_file="${RUNNER_TEMP}/Girls-Runner-Release-build-settings.txt"
          if ! xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings \
            > "$build_settings_file"; then
            cat "$build_settings_file" >&2 || true
            echo "xcodebuild could not resolve Girls Runner Release build settings" >&2
            exit 1
          fi

          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID}" "$build_settings_file" || {
            echo "Resolved Xcode build settings do not contain expected Girls bundle id ${IOS_BUNDLE_ID}" >&2
            exit 1
          }
          grep -Fq 'CODE_SIGN_STYLE = Manual' "$build_settings_file" || {
            echo "Girls Runner Release build settings are not using manual signing after target-scoped patch" >&2
            exit 1
          }
          grep -Fq 'CODE_SIGN_IDENTITY = Apple Distribution' "$build_settings_file" || {
            echo "Girls Runner Release build settings do not use Apple Distribution" >&2
            exit 1
          }
          grep -Fq "DEVELOPMENT_TEAM = ${TEAM_ID}" "$build_settings_file" || {
            echo "Girls Runner Release build settings do not use the provisioning profile team" >&2
            exit 1
          }
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}" "$build_settings_file" || {
            echo "Girls Runner Release build settings do not use provisioning profile ${PROFILE_NAME}" >&2
            exit 1
          }

          archive_path="${RUNNER_TEMP}/Girls-Runner.xcarchive"
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            archive
          popd >/dev/null

          [[ -d "$archive_path" ]] || {
            echo "xcodebuild archive completed without creating $archive_path" >&2
            exit 1
          }

          export_path="${RUNNER_TEMP}/girls-ipa"
          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa_path" && -f "$ipa_path" ]] || {
            echo "xcodebuild -exportArchive completed without producing a Girls IPA" >&2
            exit 1
          }

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Install and validate Girls App Store Connect API key
        id: asc_key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.GIRLS_APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.GIRLS_APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          [[ -s "$key_path" ]] || {
            echo "Decoded Girls App Store Connect API key is empty" >&2
            exit 1
          }
          chmod 600 "$key_path"

          [[ "$(head -n 1 "$key_path")" == "-----BEGIN PRIVATE KEY-----" ]] || {
            echo "Decoded Girls App Store Connect API key has an unexpected PEM header" >&2
            exit 1
          }
          [[ "$(tail -n 1 "$key_path")" == "-----END PRIVATE KEY-----" ]] || {
            echo "Decoded Girls App Store Connect API key has an unexpected PEM footer" >&2
            exit 1
          }
          openssl pkey -in "$key_path" -noout >/dev/null || {
            echo "Decoded Girls App Store Connect API key is not a valid private key" >&2
            exit 1
          }

          xcrun altool \
            --generate-jwt \
            --api-key "$APP_STORE_CONNECT_API_KEY_ID" \
            --api-issuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$key_path" \
            >/dev/null

          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Upload Girls IPA to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.GIRLS_APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.build.outputs.ipa_path }}
          API_KEY_PATH: ${{ steps.asc_key.outputs.key_path }}
        run: |
          set -euo pipefail
          [[ -f "$IPA_PATH" ]] || { echo "Girls IPA does not exist: $IPA_PATH" >&2; exit 1; }
          [[ -f "$API_KEY_PATH" ]] || { echo "Girls App Store Connect API key does not exist: $API_KEY_PATH" >&2; exit 1; }

          unzip -tq "$IPA_PATH" >/dev/null || {
            echo "Girls IPA is not a valid ZIP archive" >&2
            exit 1
          }

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --p8-file-path "$API_KEY_PATH"

      - name: Cleanup Girls signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set +e
          if [[ -n "$KEYCHAIN_PATH" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
