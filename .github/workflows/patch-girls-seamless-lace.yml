name: Apply seamless Girls lace integration

on:
  push:
    branches:
      - fix/girls-seamless-lace
    paths:
      - .github/workflows/patch-girls-seamless-lace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/girls-seamless-lace
      - name: Patch Girls background without fallback
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/lib/girls_app.dart')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''          colors: <Color>[
            Color(0xFFFFEDF5),
            Color(0xFFF6F0FF),
            _cream,
          ],''',
                  '''          colors: <Color>[
            Color(0xFFFFEDF5),
            Color(0xFFFFF4E6),
            Color(0xFFFFF8EE),
          ],''',
              ),
              (
                  '''    return ClipRRect(
      borderRadius: BorderRadius.circular(30),
      child: SizedBox(''',
                  '''    return ClipRRect(
      borderRadius: BorderRadius.zero,
      child: SizedBox(''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f'Expected exactly one match for patch block, found {count}. '
                      'Refusing to modify girls_app.dart.'
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          rm .github/workflows/patch-girls-seamless-lace.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls_app.dart .github/workflows/patch-girls-seamless-lace.yml
          git diff --cached --quiet && { echo 'Expected patch produced no changes.' >&2; exit 1; }
          git commit -m "Blend Girls login lace into cream background"
          git push origin HEAD:fix/girls-seamless-lace
