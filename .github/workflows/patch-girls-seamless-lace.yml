name: Apply seamless Girls lace integration

on:
  push:
    branches:
      - fix/girls-seamless-lace
    paths:
      - .github/workflows/patch-girls-seamless-lace.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/girls-seamless-lace
      - name: Apply exact patch
        run: python scripts/patch_girls_seamless_lace.py
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-girls-seamless-lace.yml
          rm scripts/patch_girls_seamless_lace.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls_app.dart .github/workflows/patch-girls-seamless-lace.yml scripts/patch_girls_seamless_lace.py
          git diff --cached --quiet && { echo "Expected patch produced no changes." >&2; exit 1; }
          git commit -m "Blend Girls login lace into cream background"
          git push origin HEAD:fix/girls-seamless-lace
