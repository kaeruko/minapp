name: Apply Girls login form patch

on:
  push:
    branches:
      - fix/girls-login-form-reference
    paths:
      - .github/workflows/apply-girls-login-form.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/girls-login-form-reference

      - name: Apply fail-fast patch
        run: python scripts/patch_girls_login_form.py

      - name: Commit patched form
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch_girls_login_form.py
          rm .github/workflows/apply-girls-login-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls_app.dart scripts/patch_girls_login_form.py .github/workflows/apply-girls-login-form.yml
          if git diff --cached --quiet; then
            echo "Expected Girls login form patch produced no changes." >&2
            exit 1
          fi
          git commit -m "Restyle Girls login form"
          git push origin HEAD:fix/girls-login-form-reference
