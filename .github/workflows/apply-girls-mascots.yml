name: Apply MinApp Girls mascots

on:
  push:
    branches:
      - feature/girls-mascots
    paths:
      - '.github/girls-assets/**'
      - 'tools/apply_girls_mascots.py'
      - '.github/workflows/apply-girls-mascots.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/girls-mascots

      - name: Reconstruct exact SVGs and patch Flutter files
        run: python tools/apply_girls_mascots.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test Flutter app
        working-directory: apps/mobile
        run: flutter test

      - name: Commit generated app changes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/mobile/assets/girls \
            apps/mobile/lib/girls_app.dart \
            apps/mobile/pubspec.yaml \
            apps/mobile/pubspec.lock \
            apps/mobile/test/girls_mascot_assets_test.dart
          git rm -r .github/girls-assets tools/apply_girls_mascots.py
          if git diff --cached --quiet; then
            echo 'Expected generated changes were not produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add MinApp Girls mascot SVGs'
          git push origin HEAD:feature/girls-mascots
