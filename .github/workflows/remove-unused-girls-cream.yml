name: Remove unused Girls cream constant

on:
  push:
    branches:
      - fix/girls-seamless-lace
    paths:
      - .github/workflows/remove-unused-girls-cream.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/girls-seamless-lace
      - name: Remove exact unused declaration
        run: python scripts/remove_unused_girls_cream.py
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/remove-unused-girls-cream.yml
          rm scripts/remove_unused_girls_cream.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls_app.dart .github/workflows/remove-unused-girls-cream.yml scripts/remove_unused_girls_cream.py
          git diff --cached --quiet && { echo "Expected cleanup produced no changes." >&2; exit 1; }
          git commit -m "Remove unused Girls cream constant"
          git push origin HEAD:fix/girls-seamless-lace
