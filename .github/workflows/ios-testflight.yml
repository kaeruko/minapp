name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IOS_BUNDLE_ID: jp.cloxs.minapp
  APP_STORE_CONNECT_API_KEY_ID: X7N54636NV
  PORTAL_CONFIG_URL: https://minapp.cloxs.jp/portal-config.json
  CREATOR_PORTAL_BASE_URL: https://minapp.cloxs.jp

jobs:
  build-and-upload:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Enable Swift Package Manager
        shell: bash
        run: |
          set -euo pipefail
          flutter config --enable-swift-package-manager
          config_output="$(flutter config --list)"
          printf '%s\n' "$config_output"
          grep -Fq 'enable-swift-package-manager: true' <<< "$config_output" || {
            echo "Flutter Swift Package Manager support is not enabled after explicit configuration" >&2
            exit 1
          }

      - name: Validate required secrets
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$APP_STORE_CONNECT_API_KEY_P8_BASE64" ]] || { echo "Missing secret: APP_STORE_CONNECT_API_KEY_P8_BASE64" >&2; exit 1; }
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] || { echo "Missing secret: APP_STORE_CONNECT_ISSUER_ID" >&2; exit 1; }
          [[ -n "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" ]] || { echo "Missing secret: IOS_DISTRIBUTION_CERTIFICATE_BASE64" >&2; exit 1; }
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || { echo "Missing secret: IOS_PROVISIONING_PROFILE_BASE64" >&2; exit 1; }

      - name: Resolve production Directory endpoint
        id: directory
        shell: bash
        run: |
          set -euo pipefail
          config_file="${RUNNER_TEMP}/portal-config.json"
          curl --fail --silent --show-error "$PORTAL_CONFIG_URL" -o "$config_file"

          schema_version="$(jq -er '.schema_version' "$config_file")"
          [[ "$schema_version" == "1" ]] || {
            echo "Unsupported portal-config schema_version: $schema_version" >&2
            exit 1
          }

          directory_api_base_url="$(jq -er '.directory_api_base_url | select(type == "string" and length > 0)' "$config_file")"
          [[ "$directory_api_base_url" == https://* ]] || {
            echo "directory_api_base_url is not HTTPS: $directory_api_base_url" >&2
            exit 1
          }

          echo "directory_api_base_url=$directory_api_base_url" >> "$GITHUB_OUTPUT"

      - name: Resolve packages and test
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Generate iOS platform
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e ios ]] || {
            echo "apps/mobile/ios already exists. This workflow expects to generate iOS from the pinned Flutter project boundary." >&2
            exit 1
          }

          temp_project="$(mktemp -d)"
          trap 'rm -rf "$temp_project"' EXIT

          flutter create \
            --platforms=ios \
            --org jp.cloxs \
            --project-name minapp \
            "$temp_project"

          [[ -d "$temp_project/ios" ]] || {
            echo "flutter create completed without generating an iOS platform directory" >&2
            exit 1
          }

          cp -R "$temp_project/ios" ./ios

          pbxproj="ios/Runner.xcodeproj/project.pbxproj"
          [[ -f "$pbxproj" ]] || {
            echo "Generated Xcode project is missing: $pbxproj" >&2
            exit 1
          }

          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID};" "$pbxproj" || {
            echo "Generated Xcode project does not contain expected bundle id ${IOS_BUNDLE_ID}" >&2
            exit 1
          }

          info_plist="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName MinApp" "$info_plist"

      - name: Validate Xcode iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_path="$(xcrun --sdk iphoneos --show-sdk-path)"
          [[ -n "$sdk_path" && -d "$sdk_path" ]] || {
            echo "iPhoneOS SDK is unavailable from the selected Xcode: $sdk_path" >&2
            exit 1
          }
          echo "Using iPhoneOS SDK: $sdk_path"

      - name: Install signing certificate and provisioning profile
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          cert_path="${RUNNER_TEMP}/distribution.p12"
          profile_path="${RUNNER_TEMP}/profile.mobileprovision"
          profile_plist="${RUNNER_TEMP}/profile.plist"
          keychain_path="${RUNNER_TEMP}/minapp-build.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$cert_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          [[ -s "$cert_path" ]] || { echo "Decoded distribution certificate is empty" >&2; exit 1; }
          [[ -s "$profile_path" ]] || { echo "Decoded provisioning profile is empty" >&2; exit 1; }

          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          profile_bundle_id="${application_identifier#*.}"

          [[ -n "$profile_uuid" && -n "$profile_name" && -n "$team_id" ]] || {
            echo "Provisioning profile is missing UUID, Name, or TeamIdentifier" >&2
            exit 1
          }

          [[ "$profile_bundle_id" == "$IOS_BUNDLE_ID" ]] || {
            echo "Provisioning profile bundle id mismatch: expected ${IOS_BUNDLE_ID}, got ${profile_bundle_id}" >&2
            exit 1
          }

          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "Provisioning profile contains ProvisionedDevices and is not an App Store distribution profile" >&2
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          current_keychains="$(security list-keychains -d user | tr -d '\"')"
          security list-keychains -d user -s "$keychain_path" $current_keychains

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          grep -Fq 'Apple Distribution' <<< "$identities" || {
            echo "Imported p12 does not expose an Apple Distribution signing identity" >&2
            exit 1
          }

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"

          pbxproj="ios/Runner.xcodeproj/project.pbxproj"
          python3 - "$pbxproj" "$team_id" "$profile_name" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          team_id = sys.argv[2]
          profile_name = sys.argv[3]
          text = path.read_text(encoding="utf-8")

          marker = "CODE_SIGN_STYLE = Automatic;"
          count = text.count(marker)
          if count == 0:
              raise RuntimeError("Generated Xcode project has no Automatic code-signing settings to replace")

          replacement = (
              "CODE_SIGN_STYLE = Manual;\n"
              f"\t\t\t\tDEVELOPMENT_TEAM = {team_id};\n"
              "\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n"
              f"\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"{profile_name}\";"
          )
          path.write_text(text.replace(marker, replacement), encoding="utf-8")
          PY

          export_options="${RUNNER_TEMP}/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${team_id}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${IOS_BUNDLE_ID}</key>
              <string>${profile_name}</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "export_options=$export_options" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA
        id: build
        shell: bash
        env:
          DIRECTORY_API_BASE_URL: ${{ steps.directory.outputs.directory_api_base_url }}
          EXPORT_OPTIONS_PLIST: ${{ steps.signing.outputs.export_options }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          set -euo pipefail

          flutter build ios \
            --release \
            --config-only \
            --no-codesign \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define="MINAPP_DIRECTORY_BASE_URL=${DIRECTORY_API_BASE_URL}" \
            --dart-define="MINAPP_CREATOR_PORTAL_BASE_URL=${CREATOR_PORTAL_BASE_URL}"

          pushd ios >/dev/null

          build_settings_file="${RUNNER_TEMP}/Runner-Release-build-settings.txt"
          if ! xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -showBuildSettings \
            > "$build_settings_file"; then
            cat "$build_settings_file" >&2 || true
            echo "xcodebuild could not resolve Runner Release build settings" >&2
            exit 1
          fi

          grep -Fq "PRODUCT_BUNDLE_IDENTIFIER = ${IOS_BUNDLE_ID}" "$build_settings_file" || {
            echo "Resolved Xcode build settings do not contain expected bundle id ${IOS_BUNDLE_ID}" >&2
            exit 1
          }
          grep -Fq 'CODE_SIGN_STYLE = Manual' "$build_settings_file" || {
            echo "Runner Release build settings are not using manual signing" >&2
            exit 1
          }
          grep -Fq 'CODE_SIGN_IDENTITY = Apple Distribution' "$build_settings_file" || {
            echo "Runner Release build settings do not use Apple Distribution" >&2
            exit 1
          }
          grep -Fq "PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}" "$build_settings_file" || {
            echo "Runner Release build settings do not use provisioning profile ${PROFILE_NAME}" >&2
            exit 1
          }

          archive_path="${RUNNER_TEMP}/Runner.xcarchive"
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            archive
          popd >/dev/null

          [[ -d "$archive_path" ]] || {
            echo "xcodebuild archive completed without creating $archive_path" >&2
            exit 1
          }

          export_path="${RUNNER_TEMP}/ipa"
          mkdir -p "$export_path"
          xcodebuild \
            -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

          ipa_path="$(find "$export_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [[ -n "$ipa_path" && -f "$ipa_path" ]] || {
            echo "xcodebuild -exportArchive completed without producing an IPA" >&2
            exit 1
          }

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Install App Store Connect API key
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          [[ -s "$key_path" ]] || {
            echo "Decoded App Store Connect API key is empty" >&2
            exit 1
          }
          chmod 600 "$key_path"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          IPA_PATH: ${{ steps.build.outputs.ipa_path }}
        run: |
          set -euo pipefail
          [[ -f "$IPA_PATH" ]] || { echo "IPA does not exist: $IPA_PATH" >&2; exit 1; }

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Cleanup signing material
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set +e
          if [[ -n "$KEYCHAIN_PATH" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          fi
          rm -rf "$HOME/.appstoreconnect/private_keys"
