name: Issue 172 finish authorization migration

on:
  push:
    branches:
      - chatgpt/issue-172-hosted-app-ownership-auth
    paths:
      - .github/workflows/issue172-fix.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/issue-172-hosted-app-ownership-auth
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply and validate full backend suite
        shell: bash
        run: |
          set -euo pipefail
          python .github/issue172_fix.py
          python -m compileall -q backend/src backend/tests
          python -m unittest discover -s backend/tests -v
          rm .github/issue172_fix.py .github/workflows/issue172-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#172 finish Hosted authorization migration"
          git push origin HEAD:chatgpt/issue-172-hosted-app-ownership-auth
