name: Fix Girls login hero SVG

on:
  push:
    branches:
      - feature/girls-login-kawaii-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Girls login hero as SVG'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/girls-login-kawaii-ui
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply fail-fast SVG fix
        run: python scripts/fix-girls-login-hero-svg.py
      - name: Commit SVG fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls_app.dart apps/mobile/pubspec.yaml apps/mobile/test/girls_login_art_assets_test.dart apps/mobile/assets/girls/generated/login_hero_bg.svg
          git rm apps/mobile/assets/girls/generated/login_hero_bg.png scripts/fix-girls-login-hero-svg.py .github/workflows/fix-girls-login-hero-svg.yml
          git diff --cached --check
          git commit -m "Fix Girls login hero as SVG"
          git push
