name: Patch Current Group Context

on:
  push:
    branches:
      - fix/girls-current-group-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_current_group_context.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use selected Girls group across app flows"
          git push origin HEAD:fix/girls-current-group-context
