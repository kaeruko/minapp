name: Patch Current Group Context

on:
  push:
    branches:
      - fix/girls-current-group-context

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Relax patch helper for first-match edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/patch_current_group_context.py')
          text = path.read_text(encoding='utf-8')
          old = '    if count != 1:\n        raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")\n'
          new = '    if count < 1:\n        raise RuntimeError(f"{path}: expected a match, found {count}: {old[:80]!r}")\n'
          if text.count(old) != 1:
              raise RuntimeError('patch helper guard did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply patch
        run: python tools/patch_current_group_context.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use selected Girls group across app flows"
          git push origin HEAD:fix/girls-current-group-context
