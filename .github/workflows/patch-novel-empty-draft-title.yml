name: Patch Novel Empty Draft Title

on:
  push:
    branches:
      - fix/novel-empty-draft-title

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch empty Novel draft title handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/lib/girls/girls_apps_page.dart')
          text = path.read_text(encoding='utf-8')
          old = """  final Object? rawTitle = project.document['title'];
"""
          new = """  // An empty document is the Authoring contract's intentional
  // uninitialized draft state. The Novel Editor fills it on first open.
  if (project.document.isEmpty) {
    return '新しいノベル';
  }
  final Object? rawTitle = project.document['title'];
"""
          if text.count(old) != 1:
              raise RuntimeError(f'expected exactly one title lookup block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          rm .github/workflows/patch-novel-empty-draft-title.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls/girls_apps_page.dart .github/workflows/patch-novel-empty-draft-title.yml
          git commit -m "Handle uninitialized Novel drafts in work list"
          git push origin HEAD:fix/novel-empty-draft-title
