name: Issue 174 apply active-member UI

on:
  push:
    branches:
      - chatgpt/issue-174-active-member-ui
    paths:
      - .github/issue174_apply.py
      - .github/workflows/issue174-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/issue-174-active-member-ui
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply #174 and validate web syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue174_apply.py')
          text = path.read_text(encoding='utf-8')

          old = 'text = replace_once(text, "      await loadOwnerGroups();\\n", "      await loadActiveGroups();\\n", "web active group loader call")'
          new = '''count = text.count("      await loadOwnerGroups();\\n")
          if count != 2:
              raise RuntimeError(f"web active group loader calls: expected 2, found {count}")
          text = text.replace("      await loadOwnerGroups();\\n", "      await loadActiveGroups();\\n")'''
          if text.count(old) != 1:
              raise RuntimeError(f'loader-call patch expected one target, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_count = text.count(start)
              end_count = text.count(end)
              if start_count != 1 or end_count != 1:
                  raise RuntimeError(
                      f"{label}: expected one start/end marker, found {start_count}/{end_count}"
                  )
              left, tail = text.split(start, 1)
              _, right = tail.split(end, 1)
              return left + replacement + end + right
          '''
          new = '''def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_count = text.count(start)
              if start_count != 1:
                  raise RuntimeError(f"{label}: expected one start marker, found {start_count}")
              left, tail = text.split(start, 1)
              if end not in tail:
                  raise RuntimeError(f"{label}: end marker was not found after start marker")
              _, right = tail.split(end, 1)
              return left + replacement + end + right
          '''
          if text.count(old) != 1:
              raise RuntimeError(f'replace-between patch expected one target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/issue174_apply.py
          node --check apps/web/girls_portal.js
          node --check apps/web/girls_portal_shell.js
          node --check apps/web/girls_footer.js
          rm .github/issue174_apply.py .github/workflows/issue174-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "#174 switch Girls UI to active-member ownership"
          git push origin HEAD:chatgpt/issue-174-active-member-ui
