name: Patch creator portal link

on:
  push:
    branches:
      - add-creator-portal-link

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-creator-portal-link
      - name: Apply fail-fast patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'apps/mobile/pubspec.yaml',
              '  shared_preferences: ">=2.5.3 <3.0.0"\n  webview_flutter: ">=4.8.0 <5.0.0"\n',
              '  shared_preferences: ">=2.5.3 <3.0.0"\n  url_launcher: 6.3.1\n  webview_flutter: ">=4.8.0 <5.0.0"\n',
          )

          replace_once(
              'apps/mobile/lib/main.dart',
              "  final Uri? joinBaseUri = rawJoinBaseUrl.isEmpty\n      ? null\n      : validatePublicHttpsBaseUri(\n          Uri.parse(rawJoinBaseUrl),\n          argumentName: 'MINAPP_JOIN_BASE_URL',\n        );\n\n  runApp(\n",
              "  final Uri? joinBaseUri = rawJoinBaseUrl.isEmpty\n      ? null\n      : validatePublicHttpsBaseUri(\n          Uri.parse(rawJoinBaseUrl),\n          argumentName: 'MINAPP_JOIN_BASE_URL',\n        );\n\n  const String rawCreatorPortalBaseUrl = String.fromEnvironment(\n    'MINAPP_CREATOR_PORTAL_BASE_URL',\n  );\n  final Uri? creatorPortalBaseUri = rawCreatorPortalBaseUrl.isEmpty\n      ? null\n      : validatePublicHttpsBaseUri(\n          Uri.parse(rawCreatorPortalBaseUrl),\n          argumentName: 'MINAPP_CREATOR_PORTAL_BASE_URL',\n        );\n\n  runApp(\n",
          )
          replace_once(
              'apps/mobile/lib/main.dart',
              '      officialJoinBaseUri: joinBaseUri,\n',
              '      officialJoinBaseUri: joinBaseUri,\n      creatorPortalBaseUri: creatorPortalBaseUri,\n',
          )

          replace_once(
              'apps/mobile/lib/session_app.dart',
              '    this.officialJoinBaseUri,\n    this.webViewDataClearer,\n',
              '    this.officialJoinBaseUri,\n    this.creatorPortalBaseUri,\n    this.webViewDataClearer,\n',
          )
          replace_once(
              'apps/mobile/lib/session_app.dart',
              '  final Uri? officialJoinBaseUri;\n  final WebViewDataClearer? webViewDataClearer;\n',
              '  final Uri? officialJoinBaseUri;\n  final Uri? creatorPortalBaseUri;\n  final WebViewDataClearer? webViewDataClearer;\n',
          )
          replace_once(
              'apps/mobile/lib/session_app.dart',
              '        officialJoinBaseUri: officialJoinBaseUri,\n        webViewDataClearer: webViewDataClearer ?? clearMinAppWebViewData,\n',
              '        officialJoinBaseUri: officialJoinBaseUri,\n        creatorPortalBaseUri: creatorPortalBaseUri,\n        webViewDataClearer: webViewDataClearer ?? clearMinAppWebViewData,\n',
          )
          replace_once(
              'apps/mobile/lib/session_app.dart',
              '    required this.officialJoinBaseUri,\n    required this.webViewDataClearer,\n',
              '    required this.officialJoinBaseUri,\n    required this.creatorPortalBaseUri,\n    required this.webViewDataClearer,\n',
          )
          replace_once(
              'apps/mobile/lib/session_app.dart',
              '  final Uri? officialJoinBaseUri;\n  final WebViewDataClearer webViewDataClearer;\n',
              '  final Uri? officialJoinBaseUri;\n  final Uri? creatorPortalBaseUri;\n  final WebViewDataClearer webViewDataClearer;\n',
          )
          replace_once(
              'apps/mobile/lib/session_app.dart',
              '      classroomName: tenant.displayName,\n      onChangeClassroom: _changeClassroom,\n      onLogout: _logout,\n',
              '      classroomName: tenant.displayName,\n      creatorPortalBaseUri: widget.creatorPortalBaseUri,\n      onChangeClassroom: _changeClassroom,\n      onLogout: _logout,\n',
          )

          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:url_launcher/url_launcher.dart';\n",
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              'enum _CatalogMenuAction { changeClassroom, logout }\n',
              'enum _CatalogMenuAction { creatorPortal, changeClassroom, logout }\n',
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '    required this.classroomName,\n    required this.onChangeClassroom,\n',
              '    required this.classroomName,\n    this.creatorPortalBaseUri,\n    required this.onChangeClassroom,\n',
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '  final String classroomName;\n  final Future<void> Function() onChangeClassroom;\n',
              '  final String classroomName;\n  final Uri? creatorPortalBaseUri;\n  final Future<void> Function() onChangeClassroom;\n',
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '  Future<void> _handleMenuAction(_CatalogMenuAction action) async {\n    switch (action) {\n      case _CatalogMenuAction.changeClassroom:\n',
              "  Future<void> _handleMenuAction(_CatalogMenuAction action) async {\n    switch (action) {\n      case _CatalogMenuAction.creatorPortal:\n        final Uri? portalBaseUri = widget.creatorPortalBaseUri;\n        if (portalBaseUri == null) {\n          throw StateError('Creator portal menu is unavailable without a configured URL.');\n        }\n        try {\n          final bool launched = await launchUrl(\n            portalBaseUri,\n            mode: LaunchMode.externalApplication,\n          );\n          if (!launched && mounted) {\n            ScaffoldMessenger.of(context).showSnackBar(\n              const SnackBar(content: Text('制作・提出ポータルを開けませんでした。')),\n            );\n          }\n        } catch (_) {\n          if (mounted) {\n            ScaffoldMessenger.of(context).showSnackBar(\n              const SnackBar(content: Text('制作・提出ポータルを開けませんでした。')),\n            );\n          }\n        }\n        return;\n      case _CatalogMenuAction.changeClassroom:\n",
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '            onSearchChanged: () => setState(() {}),\n            onMenuSelected: _handleMenuAction,\n',
              '            onSearchChanged: () => setState(() {}),\n            showCreatorPortal: widget.creatorPortalBaseUri != null,\n            onMenuSelected: _handleMenuAction,\n',
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '    required this.onSearchChanged,\n    required this.onMenuSelected,\n',
              '    required this.onSearchChanged,\n    required this.showCreatorPortal,\n    required this.onMenuSelected,\n',
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '  final VoidCallback onSearchChanged;\n  final ValueChanged<_CatalogMenuAction> onMenuSelected;\n',
              '  final VoidCallback onSearchChanged;\n  final bool showCreatorPortal;\n  final ValueChanged<_CatalogMenuAction> onMenuSelected;\n',
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '                    itemBuilder: (BuildContext context) => const <PopupMenuEntry<_CatalogMenuAction>>[\n                      PopupMenuItem<_CatalogMenuAction>(\n                        value: _CatalogMenuAction.changeClassroom,\n',
              "                    itemBuilder: (BuildContext context) => <PopupMenuEntry<_CatalogMenuAction>>[\n                      if (showCreatorPortal)\n                        const PopupMenuItem<_CatalogMenuAction>(\n                          key: Key('creator-portal-menu-item'),\n                          value: _CatalogMenuAction.creatorPortal,\n                          child: ListTile(\n                            dense: true,\n                            leading: Icon(Icons.upload_file_rounded),\n                            title: Text('アプリを作る・提出する'),\n                            trailing: Icon(Icons.open_in_new_rounded, size: 18),\n                          ),\n                        ),\n                      const PopupMenuItem<_CatalogMenuAction>(\n                        value: _CatalogMenuAction.changeClassroom,\n",
          )
          replace_once(
              'apps/mobile/lib/catalog_page.dart',
              '                      PopupMenuItem<_CatalogMenuAction>(\n                        value: _CatalogMenuAction.logout,\n',
              '                      const PopupMenuItem<_CatalogMenuAction>(\n                        value: _CatalogMenuAction.logout,\n',
          )

          replace_once(
              'apps/mobile/test/widget_test.dart',
              '  Uri? officialJoinBaseUri,\n}) =>\n',
              '  Uri? officialJoinBaseUri,\n  Uri? creatorPortalBaseUri,\n}) =>\n',
          )
          replace_once(
              'apps/mobile/test/widget_test.dart',
              '      officialJoinBaseUri: officialJoinBaseUri,\n      webViewDataClearer: () async {},\n',
              '      officialJoinBaseUri: officialJoinBaseUri,\n      creatorPortalBaseUri: creatorPortalBaseUri,\n      webViewDataClearer: () async {},\n',
          )
          marker = "  testWidgets('first setup resolves and verifies classroom before login', (\n"
          test_block = """  testWidgets('catalog menu shows creator portal when configured', (\n    WidgetTester tester,\n  ) async {\n    final FakeDirectory directory = FakeDirectory(descriptor: _descriptor());\n    final FakeTenantStore store = FakeTenantStore(\n      _configuredTenant(expired: false),\n    );\n\n    await tester.pumpWidget(\n      _app(\n        directory: directory,\n        store: store,\n        creatorPortalBaseUri: Uri.parse('https://portal.minapp.example'),\n      ),\n    );\n    await tester.pumpAndSettle();\n\n    await tester.enterText(find.byKey(const Key('login-id')), 'student-demo');\n    await tester.enterText(\n      find.byKey(const Key('login-password')),\n      'Password123',\n    );\n    await tester.tap(find.byKey(const Key('login-submit')));\n    await tester.pumpAndSettle();\n\n    await tester.tap(find.byKey(const Key('catalog-menu')));\n    await tester.pumpAndSettle();\n\n    expect(find.text('アプリを作る・提出する'), findsOneWidget);\n    expect(find.byKey(const Key('creator-portal-menu-item')), findsOneWidget);\n  });\n\n"""
          p = Path('apps/mobile/test/widget_test.dart')
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('apps/mobile/test/widget_test.dart: test insertion marker mismatch')
          p.write_text(text.replace(marker, test_block + marker, 1), encoding='utf-8')

          replace_once(
              'apps/mobile/README.md',
              '端末へ保存するのは次だけ:\n',
              """### 制作・提出ポータル\n\n公式の制作・提出Webポータルを用意したbuildでは、そのoriginをbuild時に固定する。\n\n```powershell\nflutter run `\n  --dart-define=MINAPP_DIRECTORY_BASE_URL=$directoryApi `\n  --dart-define=MINAPP_CREATOR_PORTAL_BASE_URL=https://<creator-portal-domain>\n```\n\nこのdefineを設定した場合だけ、Androidの右上メニューに「アプリを作る・提出する」を表示し、外部ブラウザで公式ポータルを開く。URLはユーザー入力やtenant responseから受け取らず、public HTTPS originとしてbuild時に固定する。不正なURLを設定したbuildは起動時に停止する。\n\n端末へ保存するのは次だけ:\n""",
          )
          PY

          rm .github/workflows/patch-creator-portal-link.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add creator portal link to Android menu"
          git push
