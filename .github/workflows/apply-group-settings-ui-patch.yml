name: Apply group settings UI patch

on:
  push:
    branches:
      - feat/group-settings
    paths:
      - tools/apply_group_settings_ui_patch.py
      - .github/workflows/apply-group-settings-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply fail-fast UI patch
        run: python tools/apply_group_settings_ui_patch.py
      - name: Verify patch shape
        run: |
          git diff --check
          git diff --exit-code -- tools/apply_group_settings_ui_patch.py .github/workflows/apply-group-settings-ui-patch.yml
          git diff -- apps/mobile/lib/girls/girls_groups_dashboard_page.dart
      - name: Commit patched dashboard
        run: |
          if git diff --quiet -- apps/mobile/lib/girls/girls_groups_dashboard_page.dart; then
            echo "Expected dashboard patch produced no changes." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/girls/girls_groups_dashboard_page.dart
          git commit -m "feat: add group settings entry point"
          git push origin HEAD:feat/group-settings
