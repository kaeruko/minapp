name: Patch student temporary password generator

on:
  push:
    branches:
      - simplify-temporary-passwords

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: simplify-temporary-passwords
      - name: Patch generator and test
        run: |
          python - <<'PY'
          from pathlib import Path

          backend = Path('backend/src/aws_backend.py')
          text = backend.read_text(encoding='utf-8')
          old_imports = 'import os\nimport secrets\nimport string\nimport uuid\n'
          new_imports = 'import os\nimport secrets\nimport uuid\n'
          if old_imports not in text:
              raise SystemExit('Expected aws_backend import block was not found')
          text = text.replace(old_imports, new_imports, 1)

          old_function = '''def _new_temporary_password() -> str:\n    alphabet = string.ascii_letters + string.digits\n    random_tail = "".join(secrets.choice(alphabet) for _ in range(13))\n    return f"Ma1{random_tail}"\n'''
          new_function = '''_TEMPORARY_PASSWORD_ALPHABET = "23456789"\n_TEMPORARY_PASSWORD_LENGTH = 8\n\n\ndef _new_temporary_password() -> str:\n    return "".join(\n        secrets.choice(_TEMPORARY_PASSWORD_ALPHABET)\n        for _ in range(_TEMPORARY_PASSWORD_LENGTH)\n    )\n'''
          if old_function not in text:
              raise SystemExit('Expected aws_backend password generator was not found')
          backend.write_text(text.replace(old_function, new_function, 1), encoding='utf-8')

          tests = Path('backend/tests/test_aws_backend.py')
          test_text = tests.read_text(encoding='utf-8')
          old_test_import = 'from aws_backend import AwsBackend, _User  # noqa: E402\n'
          new_test_import = 'from aws_backend import AwsBackend, _User, _new_temporary_password  # noqa: E402\n'
          if old_test_import not in test_text:
              raise SystemExit('Expected backend test import was not found')
          test_text = test_text.replace(old_test_import, new_test_import, 1)

          marker = '    def test_temporary_password_login_requires_change(self) -> None:\n'
          test_method = '''    def test_generated_temporary_password_is_eight_easy_digits(self) -> None:\n        for _ in range(100):\n            password = _new_temporary_password()\n            self.assertEqual(len(password), 8)\n            self.assertTrue(all(character in "23456789" for character in password))\n\n'''
          if marker not in test_text:
              raise SystemExit('Expected backend test insertion point was not found')
          tests.write_text(test_text.replace(marker, test_method + marker, 1), encoding='utf-8')

          workflow = Path('.github/workflows/patch-temporary-password-generator.yml')
          if not workflow.is_file():
              raise SystemExit('Temporary patch workflow was not found')
          workflow.unlink()
          PY
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/src/aws_backend.py backend/tests/test_aws_backend.py .github/workflows/patch-temporary-password-generator.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch was produced'; exit 1; }
          git commit -m "Use easy-to-type student temporary passwords"
          git push origin HEAD:simplify-temporary-passwords
